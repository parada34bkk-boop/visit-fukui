<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visit Fukui</title>
<meta name="theme-color" content="#EAF3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visit Fukui">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl.js"></script>
<style>
:root{
  /* layout: full-bleed map, floating round buttons, one pill bar at the bottom, sheets slide up over it */
  --land:#EAF3EC; --water:#A6D6EA; --ink:#1F3D36; --muted:#6B827B; --card:#FFFFFF; --accent:#1F6F5C; --pink:#E8508F;
  --shadow:0 6px 20px rgba(31,61,54,.14),0 1px 3px rgba(31,61,54,.10);
  --font:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--land);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#map{position:absolute;inset:0;z-index:0}
[hidden]{display:none!important}
.maplibregl-ctrl-attrib{font-size:10px;font-family:var(--font)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:calc(92px + var(--safe-b))}

.fab{position:absolute;z-index:5;width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px}
#brand{position:absolute;z-index:5;left:16px;top:calc(16px + var(--safe-t));height:56px;padding:0 20px 0 8px;border-radius:28px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.01em}
#brand .logo{width:40px;height:40px;border-radius:50%;background:var(--land);display:flex;align-items:center;justify-content:center;font-size:22px}
#brand small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
#saved-btn{right:16px;top:calc(16px + var(--safe-t))}
#saved-btn .n{position:absolute;top:2px;right:2px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
#loc-btn{right:16px;bottom:calc(100px + var(--safe-b))}
#loc-btn.on svg{fill:var(--accent)}

.chips{position:absolute;z-index:4;left:0;right:0;top:calc(84px + var(--safe-t));display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;border-radius:19px;background:var(--card);box-shadow:0 2px 8px rgba(31,61,54,.12);padding:0 14px 0 10px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;transition:background .15s,color .15s}
.chip span{font-size:18px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

.bar{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(14px + var(--safe-b));height:76px;border-radius:38px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:8px;max-width:560px;margin:0 auto}
.search{flex:1;min-width:0;height:60px;border-radius:30px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 16px 0 10px;box-shadow:0 1px 4px rgba(31,61,54,.08)}
.search .mascot{font-size:26px;line-height:1}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;font-weight:700}
.search input::placeholder{color:#9AACA6;font-weight:600}
.round{flex:none;width:60px;height:60px;border-radius:50%;background:var(--card);font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(31,61,54,.08);transition:transform .15s}
.round:active{transform:scale(.92)}

.mk{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .dot{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(31,61,54,.25);display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid #fff;transition:transform .18s}
.mk.hi .dot{width:52px;height:52px;font-size:28px}
.mk .lbl{position:absolute;top:100%;margin-top:4px;white-space:nowrap;font-weight:800;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.92);padding:2px 9px;border-radius:10px;box-shadow:0 1px 4px rgba(31,61,54,.15);pointer-events:none;display:none}
.mk.hi .lbl{display:block}
.mk.on .dot{transform:scale(1.18);border-color:var(--accent)}
.mk.on .lbl{display:block;background:var(--ink);color:#fff}
.mk.saved .dot::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.mk .num{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
.mk.inday .num{display:flex}
body.far .mk.inday{display:flex!important}
body.far .mk:not(.hi):not(.on){display:none}
body.far .mk.hi:not(.on) .lbl{display:none}
body.mid .mk:not(.hi):not(.on) .dot{width:30px;height:30px;font-size:15px;border-width:2px}
.mk.hidden{display:none!important}
.me{width:22px;height:22px;border-radius:50%;background:#2F80ED;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);position:relative}
.me::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(47,128,237,.18);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}

.sheet{position:absolute;z-index:7;left:0;right:0;bottom:0;max-height:72%;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -6px 30px rgba(31,61,54,.16);padding:10px 20px calc(24px + var(--safe-b));overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#D5E0DB;margin:0 auto 10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.01em;flex:1}
.x{width:36px;height:36px;border-radius:50%;background:#EEF3F1;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.sub{color:var(--muted);font-size:13px;font-weight:700;margin:0 0 6px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:11px 0;border-bottom:1px solid #EEF3F1;text-align:left}
.row:last-child{border-bottom:0}
.row .em{width:48px;height:48px;border-radius:16px;background:var(--land);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.row b{display:block;font-size:15.5px;font-weight:800;line-height:1.25}
.row em{display:block;font-style:normal;font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.row .d{margin-left:auto;text-align:right;font-weight:900;font-size:15px;white-space:nowrap;padding-left:8px}
.row .d small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.empty{padding:22px 4px;text-align:center;color:var(--muted);font-weight:700}
.cta{width:100%;height:52px;border-radius:26px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;margin:8px 0 4px}

.place .top{display:flex;gap:14px;align-items:flex-start}
.place .badge{width:64px;height:64px;border-radius:20px;background:var(--land);display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.place h2{margin:2px 0 0;font-size:23px;font-weight:900;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.place .jp{color:var(--muted);font-weight:700;font-size:14px;margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.pill{background:#F1F6F3;border-radius:12px;padding:6px 11px;font-size:13px;font-weight:800}
.pill.g{background:#E3F2EA;color:var(--accent)}
.place p{font-size:15.5px;line-height:1.6;margin:12px 0 16px;color:#2C4740}
.acts{display:flex;gap:10px}
.acts button,.acts a{flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:15.5px;text-decoration:none}
.acts .go{background:var(--ink);color:#fff}
.acts .save{background:#F1F6F3;color:var(--ink)}
.acts .save.on{background:#FCE4EE;color:#B5265F}
.note{font-size:12px;color:#93A6A0;font-weight:600;margin-top:12px}

.planpill{flex:none;height:60px;border-radius:30px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;padding:0 18px 0 14px;box-shadow:0 2px 8px rgba(31,61,54,.25)}
.planpill span{font-size:22px}
.planpill.has{background:var(--accent)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#F4F8F6;border-radius:20px;padding:14px;margin:8px 0}
.opt .ems{font-size:22px;letter-spacing:-3px;flex:none;width:66px;white-space:nowrap}
.opt b{display:block;font-size:16px;font-weight:900}
.opt em{display:block;font-style:normal;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.lbl2{font-size:13px;font-weight:900;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{height:44px;min-width:52px;padding:0 16px;border-radius:22px;background:#F1F6F3;font-weight:900;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.days button{flex:none;height:40px;padding:0 16px;border-radius:20px;background:#F1F6F3;font-weight:900;font-size:14px}
.days button[aria-pressed="true"]{background:var(--accent);color:#fff}
.meter{height:10px;border-radius:5px;background:#EEF3F1;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.over i{background:#E0794A}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-top:10px}
.sum .warn{color:#C25A2C}
.stop{display:flex;align-items:center;gap:12px;padding:10px 0}
.stop .n{width:28px;height:28px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.stop .em{width:44px;height:44px;border-radius:14px;background:var(--land);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.stop .t{flex:1;min-width:0;text-align:left}
.stop b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.stop em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:700}
.stop .ctl{display:flex;gap:4px}
.stop .ctl button{width:32px;height:32px;border-radius:16px;background:#F1F6F3;font-weight:900;font-size:13px}
.leg{margin-left:13px;border-left:2px dashed #CFDDD6;padding:4px 0 4px 26px;font-size:12.5px;font-weight:800;color:var(--muted)}
.hint{background:#F4F8F6;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;color:#3D5A52;margin:12px 0}
.link{color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline;margin-top:10px;display:inline-block}
.acts .add{background:var(--accent);color:#fff}
.acts .add.on{background:#E3F2EA;color:var(--accent)}
.toast{position:absolute;z-index:9;left:50%;top:calc(90px + var(--safe-t));transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}
@media (min-width:760px){
  .sheet{left:16px;right:auto;bottom:calc(104px + var(--safe-b));width:400px;border-radius:28px;max-height:calc(100% - 210px);margin:0}
  .bar{left:16px;right:auto;width:420px;margin:0}
  .maplibregl-ctrl-bottom-left{bottom:0}
}
@media (max-width:380px){#brand small{display:none}.round{width:54px;height:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="far">
<div id="map" aria-label="Map of Fukui"></div>

<div id="brand"><span class="logo" aria-hidden="true">🦕</span><span>Visit Fukui<small>福井 · Japan</small></span></div>
<button class="fab" id="saved-btn" aria-label="Saved places">❤️<span class="n" id="saved-n" hidden></span></button>
<div class="chips" id="chips" role="toolbar" aria-label="Filter by type"></div>
<button class="fab" id="loc-btn" aria-label="Show my location"><svg viewBox="0 0 24 24" fill="none" stroke="#1F3D36" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.5l7 18-7-4-7 4z"/></svg></button>

<div class="bar">
  <label class="search"><span class="mascot" aria-hidden="true">🦕</span><input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search places"></label>
  <button class="round" id="near-btn" aria-label="Places near me">📍</button>
  <button class="planpill" id="plan-btn"><span aria-hidden="true">🗺️</span>Plan</button>
</div>

<section class="sheet" id="sheet" aria-live="polite"></section>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS = {
  dino:{name:"Dinosaurs", e:"🦕"}, nature:{name:"Nature", e:"⛰️"}, temple:{name:"Temples", e:"⛩️"},
  history:{name:"Castles & history", e:"🏯"}, onsen:{name:"Onsen", e:"♨️"}, food:{name:"Food", e:"🍜"},
  craft:{name:"Crafts", e:"🎨"}, station:{name:"Stations", e:"🚄"}
};
const EMOJI = {dino:"🦕", heisenji:"⛩️", eiheiji:"🔔", tojinbo:"🌊", maruoka:"🏯", awara:"♨️", ichijodani:"🏘️", yokokan:"🍵", ono:"🏯", washi:"📜", knife:"🔪", megane:"👓", coast:"🌅", crab:"🦀", katsudon:"🍱", soba:"🍜", kehi:"⛩️", mikata:"🏞️", kumagawa:"🏮", obama:"🐟", "st-fukui":"🚄", "st-tsuruga":"🚄", "st-awara":"🚄", "st-takefu":"🚄"};
const PLACES = [
  {id:"dino", cat:"dino", hi:1, name:"Fukui Prefectural Dinosaur Museum", jp:"福井県立恐竜博物館", town:"Katsuyama", lat:36.083, lon:136.507, time:"3–4 h", access:"Echizen Rwy + bus", desc:"One of the world's big dinosaur museums, built near the quarries where Japan's own dinosaurs were dug up. Huge skeletons, a live-moving T. rex and a fossil dig area."},
  {id:"heisenji", cat:"temple", name:"Heisenji Hakusan Shrine", jp:"平泉寺白山神社", town:"Katsuyama", lat:36.050, lon:136.533, time:"1 h", access:"Car / taxi", desc:"An ancient mountain shrine where the whole forest floor is a carpet of moss under giant cedars. Quiet and green, best after rain."},
  {id:"eiheiji", cat:"temple", hi:1, name:"Eiheiji Temple", jp:"永平寺", town:"Eiheiji", lat:36.055, lon:136.355, time:"1.5–2 h", access:"Direct bus from Fukui Stn", desc:"Head temple of Soto Zen, founded in 1244. Monks still train here; covered wooden corridors climb the hillside between halls."},
  {id:"tojinbo", cat:"nature", hi:1, name:"Tojinbo Cliffs", jp:"東尋坊", town:"Sakai", lat:36.238, lon:136.123, time:"1–1.5 h", access:"Bus from Awara-Onsen Stn", desc:"Rugged basalt columns rising straight out of the Sea of Japan. Walk the cliff edge, take a short boat trip, and stay for the sunset."},
  {id:"maruoka", cat:"history", name:"Maruoka Castle", jp:"丸岡城", town:"Sakai", lat:36.152, lon:136.272, time:"45 min", access:"Bus from Fukui Stn", desc:"One of only twelve castles in Japan with its original keep. Small and steep inside, and ringed with cherry trees in spring."},
  {id:"awara", cat:"onsen", name:"Awara Onsen", jp:"あわら温泉", town:"Awara", lat:36.222, lon:136.190, time:"Overnight", access:"Shinkansen Awara-Onsen", desc:"Fukui's best-known hot spring town, with ryokan baths and a free footbath outside the station. A good base for Tojinbo."},
  {id:"ichijodani", cat:"history", hi:1, name:"Ichijodani Asakura Ruins", jp:"一乗谷朝倉氏遺跡", town:"Fukui City", lat:35.997, lon:136.296, time:"1.5 h", access:"JR Etsumi-Hoku Line", desc:"A whole samurai-era castle town lost in 1573 and dug out again, with a rebuilt street of houses and shops you can walk through."},
  {id:"yokokan", cat:"history", name:"Yokokan Garden", jp:"養浩館庭園", town:"Fukui City", lat:36.073, lon:136.217, time:"45 min", access:"Walk from Fukui Stn", desc:"A former lord's villa built around a pond, with tatami rooms that open onto the water. A calm stop in the city centre."},
  {id:"ono", cat:"history", hi:1, name:"Echizen Ono Castle", jp:"越前大野城", town:"Ono", lat:35.979, lon:136.482, time:"1 h", access:"JR Kuzuryu Line", desc:"The \"castle in the sky\": on autumn mornings it floats above a sea of cloud. Ono's old town below is known for spring water."},
  {id:"washi", cat:"craft", name:"Echizen Washi Village", jp:"越前和紙の里", town:"Echizen City", lat:35.906, lon:136.236, time:"1–2 h", access:"Bus from Takefu", desc:"A papermaking area with 1,500 years of history. Watch artisans at work and make your own sheet of washi."},
  {id:"knife", cat:"craft", name:"Takefu Knife Village", jp:"タケフナイフビレッジ", town:"Echizen City", lat:35.884, lon:136.140, time:"1 h", access:"Car / taxi", desc:"A shared workshop where Echizen knife makers forge blades. See the forging up close and buy straight from the makers."},
  {id:"megane", cat:"craft", name:"Megane Museum", jp:"めがねミュージアム", town:"Sabae", lat:35.950, lon:136.187, time:"1 h", access:"Walk from Sabae Stn", desc:"Sabae makes most of Japan's glasses frames. Learn the story, shop local brands, or make a frame yourself."},
  {id:"coast", cat:"nature", name:"Echizen Coast", jp:"越前海岸", town:"Echizen Town", lat:35.985, lon:136.025, time:"Half day drive", access:"Car recommended", desc:"A dramatic coastal road of cliffs and rock arches. In winter, wild narcissus flowers cover the slopes."},
  {id:"crab", cat:"food", name:"Echizen crab at Mikuni Port", jp:"越前がに", town:"Sakai", lat:36.212, lon:136.160, time:"1 h", access:"Near Tojinbo", desc:"Fukui's famous snow crab, landed in the colder months. Try it boiled whole at a harbour restaurant."},
  {id:"katsudon", cat:"food", name:"Sauce katsudon", jp:"ソースカツ丼", town:"Fukui City", lat:36.055, lon:136.235, time:"45 min", access:"Near Fukui Stn", desc:"Fukui's soul food: thin pork cutlets dipped in a sweet Worcestershire sauce over rice."},
  {id:"soba", cat:"food", name:"Echizen oroshi soba", jp:"越前おろしそば", town:"Echizen City", lat:35.900, lon:136.180, time:"45 min", access:"Near Echizen-Takefu Stn", desc:"Cold buckwheat noodles topped with grated daikon radish and bonito flakes. Light, peppery and very local."},
  {id:"kehi", cat:"temple", name:"Kehi Jingu Shrine", jp:"氣比神宮", town:"Tsuruga", lat:35.656, lon:136.081, time:"45 min", access:"Walk from Tsuruga Stn", desc:"Tsuruga's grand shrine, with one of Japan's three great wooden torii gates at the entrance."},
  {id:"mikata", cat:"nature", hi:1, name:"Mikata Five Lakes · Rainbow Line", jp:"三方五湖", town:"Wakasa / Mihama", lat:35.585, lon:135.887, time:"2 h", access:"Car recommended", desc:"Five lakes, each a different shade of blue, seen from a hilltop terrace at the top of the Rainbow Line scenic road."},
  {id:"kumagawa", cat:"history", name:"Kumagawa-juku", jp:"熊川宿", town:"Wakasa", lat:35.465, lon:135.904, time:"1 h", access:"Bus from Kaminaka", desc:"An old post town on the Saba Kaido, the route that carried mackerel to Kyoto. Wooden houses line a clear water channel."},
  {id:"obama", cat:"food", name:"Obama: mackerel and temples", jp:"小浜", town:"Obama", lat:35.497, lon:135.746, time:"Half day", access:"JR Obama Line", desc:"Start of the mackerel road to Kyoto. Eat grilled saba, then visit some of the many old temples in the hills around town."},

  {id:"st-awara", cat:"station", name:"Awara-Onsen Station", jp:"芦原温泉駅", town:"Awara", lat:36.211, lon:136.233, time:"—", access:"Hokuriku Shinkansen", desc:"Shinkansen stop for Awara Onsen and the closest station for buses to Tojinbo."},
  {id:"st-takefu", cat:"station", name:"Echizen-Takefu Station", jp:"越前たけふ駅", town:"Echizen City", lat:35.888, lon:136.193, time:"—", access:"Hokuriku Shinkansen", desc:"Shinkansen stop for the knife, paper and pottery villages of Echizen."}
];
const em = p => EMOJI[p.id] || CATS[p.cat].e;
const shortName = p => p.name.replace("Fukui Prefectural ", "").replace(" at Mikuni Port", "").replace(" · Rainbow Line", "").replace(": mackerel and temples", "");
const FUKUI_STN = {lat:36.062, lon:136.223};

let selected = null, me = null, watchId = null, map = null;
const active = new Set();
let saved = [];
try { saved = JSON.parse(localStorage.getItem("vf-trip") || "[]"); } catch (e) {}
const els = {};

function dist(a, b){
  const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lon - a.lon);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = d => d < 1 ? `${Math.max(10, Math.round(d * 100) * 10)} m` : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
const howLong = d => d <= 2 ? `${Math.max(1, Math.round(d * 1000 / 80))} min walk` : `~${Math.round(d / 35 * 60 + 5)} min drive`;
const inFukui = () => me && dist(me, FUKUI_STN) < 70;
const origin = () => inFukui() ? me : FUKUI_STN;

const THEME = {land:"#EAF3EC", water:"#A6D6EA", green:"#CFE8D2", road:"#FFFFFF", casing:"#DCE8DF", rail:"#C9D9CF", building:"#DEEAE1", border:"#BFD3C6", label:"#2E5A4F", halo:"#F3F8F4"};
function theme(){
  map.getStyle().layers.forEach(l => {
    const id = l.id.toLowerCase(), set = (k, v) => { try { map.setPaintProperty(l.id, k, v); } catch (e) {} }, lay = (k, v) => { try { map.setLayoutProperty(l.id, k, v); } catch (e) {} };
    if (l.type === "background") set("background-color", THEME.land);
    else if (l.type === "fill"){
      if (/water|ocean|lake|river|sea/.test(id)) set("fill-color", THEME.water);
      else if (/park|wood|forest|grass|scrub|landcover|green|cemetery|golf|nature/.test(id)){ set("fill-color", THEME.green); set("fill-opacity", .85); }
      else if (/building/.test(id)){ set("fill-color", THEME.building); set("fill-outline-color", THEME.building); }
      else if (/landuse|residential|industrial|commercial|school|hospital|aeroway/.test(id)) set("fill-color", THEME.land);
    } else if (l.type === "fill-extrusion") lay("visibility", "none");
    else if (l.type === "line"){
      if (/water|river|stream|canal|ditch/.test(id)) set("line-color", THEME.water);
      else if (/casing|outline/.test(id)) set("line-color", THEME.casing);
      else if (/rail|transit/.test(id)) set("line-color", THEME.rail);
      else if (/boundary|admin/.test(id)) set("line-color", THEME.border);
      else if (/road|highway|street|path|motorway|trunk|primary|secondary|tertiary|minor|service|bridge|tunnel|track/.test(id)) set("line-color", THEME.road);
    } else if (l.type === "symbol"){
      if (/poi|housenum|aerodrome|airport|mountain_peak/.test(id)) return lay("visibility", "none");
      if (l.layout && l.layout["text-field"]){
        lay("text-field", ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"]]);
        set("text-color", THEME.label); set("text-halo-color", THEME.halo); set("text-halo-width", 1.4);
      }
      if (l.layout && l.layout["icon-image"] && /road|shield|highway/.test(id)) lay("visibility", "none");
    }
  });
}

function initMap(){
  if (!window.maplibregl){ document.getElementById("map").innerHTML = '<div class="nomap">The map could not load. Check your connection.</div>'; return; }
  map = new maplibregl.Map({
    container: "map", style: "https://tiles.openfreemap.org/styles/positron",
    center: [136.25, 35.95], zoom: 8.6, minZoom: 7, maxZoom: 18, attributionControl: {compact: true},
    maxBounds: [[134.6, 34.9], [137.6, 36.9]]
  });
  map.on("style.load", theme);
  map.on("load", drawRoute);
  map.on("zoom", zoomClass);
  map.on("click", e => { if (!e.originalEvent.target.closest(".mk")) closeSheet(); });
  const wide = innerWidth >= 760;
  map.once("load", () => map.fitBounds([[135.45, 35.40], [136.85, 36.30]], {padding: {top: 140, bottom: wide ? 40 : 120, left: wide ? 440 : 20, right: 20}, duration: 0}));
  PLACES.forEach(p => {
    const el = document.createElement("div");

    el.innerHTML = `<div class="dot">${em(p)}<span class="num"></span></div><div class="lbl">${shortName(p)}</div>`;
    el.setAttribute("role", "button"); el.setAttribute("aria-label", p.name); el.tabIndex = 0;
    el.addEventListener("click", e => { e.stopPropagation(); openPlace(p.id, true); });
    el.addEventListener("keydown", e => { if (e.key === "Enter") openPlace(p.id, true); });
    new maplibregl.Marker({element: el, anchor: "center"}).setLngLat([p.lon, p.lat]).addTo(map);
    els[p.id] = el;
  });
  zoomClass(); syncMarkers();
}
function zoomClass(){
  const z = map ? map.getZoom() : 8;
  document.body.classList.toggle("far", z < 10);
  document.body.classList.toggle("mid", z >= 10 && z < 12);
}
function syncMarkers(){
  PLACES.forEach(p => {
    const el = els[p.id]; if (!el) return;
    el.classList.toggle("hidden", active.size > 0 && !active.has(p.cat));
    el.classList.toggle("on", selected === p.id);
    el.classList.toggle("saved", saved.includes(p.id));
    const k = plan ? plan.stops[day].indexOf(p.id) : -1;
    el.classList.toggle("inday", k >= 0);
    el.querySelector(".num").textContent = k >= 0 ? k + 1 : "";
    el.parentElement && (el.style.zIndex = selected === p.id ? 10 : p.hi ? 2 : 1);
  });
  document.getElementById("plan-btn").classList.toggle("has", !!plan);
  drawRoute();
  const n = document.getElementById("saved-n");
  n.hidden = !saved.length; n.textContent = saved.length;
}

function buildChips(){
  const c = document.getElementById("chips");
  c.innerHTML = Object.entries(CATS).map(([k, v]) => `<button class="chip" data-k="${k}" aria-pressed="false"><span>${v.e}</span>${v.name}</button>`).join("");
  c.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const k = b.dataset.k;
    active.has(k) ? active.delete(k) : active.add(k);
    b.setAttribute("aria-pressed", active.has(k));
    syncMarkers();
    if (sheetMode === "list") renderList(listTitle, listItems());
  });

const sheet = document.getElementById("sheet");
let sheetMode = null, prevMode = null, listTitle = "", listKind = "near";
function openSheet(html, mode){ sheet.innerHTML = `<div class="grab"></div>${html}`; sheet.classList.add("open"); sheet.scrollTop = 0; sheetMode = mode; const x = sheet.querySelector(".x"); if (x) x.onclick = closeSheet; }
function closeSheet(){ if (sheetMode === "place" && plan && prevMode === "trip"){ selected = null; prevMode = null; return tripView(); } sheet.classList.remove("open"); sheetMode = null; selected = null; syncMarkers(); }
const row = (p, d) => `<button class="row" data-id="${p.id}"><span class="em">${em(p)}</span><span><b>${shortName(p)}</b><em>${CATS[p.cat].name} · ${p.town}</em></span>${d !== undefined ? `<span class="d">${fmtDist(d)}<small>${howLong(d)}</small></span>` : ""}</button>`;
function bindRows(){ sheet.querySelectorAll(".row").forEach(b => b.onclick = () => openPlace(b.dataset.id, true)); }

function listItems(){
  const q = document.getElementById("q").value.trim().toLowerCase(), o = origin();
  let items = PLACES.filter(p => (active.size === 0 || active.has(p.cat)));
  if (listKind === "search" && q) items = items.filter(p => (p.name + " " + p.jp + " " + p.town + " " + CATS[p.cat].name).toLowerCase().includes(q));
  if (listKind === "saved") items = items.filter(p => saved.includes(p.id));
  if (listKind === "near") items = items.filter(p => p.cat !== "station");
  return items.map(p => ({p, d: dist(o, p)})).sort((a, b) => a.d - b.d);
}
function renderList(title, items){
  listTitle = title;
  const sub = listKind === "saved" ? "Your saved places, nearest first" : inFukui() ? "Distance from where you are" : me ? "You're outside Fukui · distance from Fukui Station" : "Distance from Fukui Station";
  const body = items.length ? items.map(({p, d}) => row(p, d)).join("") :
    `<div class="empty">${listKind === "saved" ? "Tap ❤️ on any place to save it here." : "No places match. Try another word or filter."}</div>`;
  openSheet(`<div class="shead"><h2>${title}</h2><button class="x" aria-label="Close">✕</button></div><p class="sub">${sub}</p>
    ${listKind === "near" && !me ? '<button class="cta" id="use-loc">📍 Use my location</button>' : ""}${body}`, "list");
  const u = document.getElementById("use-loc"); if (u) u.onclick = () => locate(true);
  bindRows();
}

function openPlace(id, fly){
  if (sheetMode === "trip") prevMode = "trip";
  const p = PLACES.find(q => q.id === id), on = saved.includes(id);
  selected = id; syncMarkers();
  if (fly && map){
    const wide = innerWidth >= 760, z = Math.max(map.getZoom(), 13);
    map.flyTo({center: [p.lon, p.lat], zoom: z, offset: [wide ? 210 : 0, wide ? 0 : -innerHeight * .2], duration: 900});
  }
  const d = dist(origin(), p), near = inFukui();
  const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=${near && d < 2 ? "walking" : "transit"}`;
  openSheet(`<div class="place">
    <div class="top"><div class="badge">${em(p)}</div><div style="flex:1"><h2>${p.name}</h2><div class="jp">${p.jp} · ${p.town}</div></div><button class="x" aria-label="Close">✕</button></div>
    <div class="pills"><span class="pill g">${fmtDist(d)} ${near ? "away" : "from Fukui Stn"}</span><span class="pill">⏱ ${p.time}</span><span class="pill">🚃 ${p.access}</span></div>
    <p>${p.desc}</p>
    <div class="acts">${p.cat === "station" ? "" : plan ? addBtn(id) : `<button class="save ${on ? "on" : ""}" id="save">${on ? "❤️ Saved" : "🤍 Save"}</button>`}<a class="go" href="${gmaps}" target="_blank" rel="noopener">Directions</a></div>
    <div class="note">Sample data. Check opening hours and fees before you go.</div></div>`, "place");
  const ad = document.getElementById("addday");
  if (ad) ad.onclick = () => {
    const where = plan.stops.findIndex(d => d.includes(id));
    if (where >= 0){ plan.stops[where] = plan.stops[where].filter(x => x !== id); toast(`Removed from Day ${where + 1}`); }
    else { plan.stops[day].push(id); toast(`Added to Day ${day + 1}`); }
    savePlan(); openPlace(id);
  };
  const s = document.getElementById("save");
  if (s) s.onclick = () => {
    saved.includes(id) ? saved = saved.filter(x => x !== id) : saved.push(id);
    try { localStorage.setItem("vf-trip", JSON.stringify(saved)); } catch (e) {}
    toast(saved.includes(id) ? "Saved ❤️" : "Removed");
    openPlace(id);
  };
}

let meMarker = null;
function drawMe(){
  if (!map || !me) return;
  if (!meMarker){ const el = document.createElement("div"); el.className = "me"; meMarker = new maplibregl.Marker({element: el}).setLngLat([me.lon, me.lat]).addTo(map); }
  else meMarker.setLngLat([me.lon, me.lat]);
}
function locate(center){
  if (!navigator.geolocation){ toast("Location isn't available here"); return; }
  if (watchId !== null){ if (center && me) centerMe(); return; }
  if (center) toast("Finding you…");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const prev = me;
    me = {lat: pos.coords.latitude, lon: pos.coords.longitude};
    document.getElementById("loc-btn").classList.add("on");
    drawMe();
    if (first && center) centerMe();
    first = false;
    if (sheetMode === "list" && listKind === "near" && (!prev || dist(prev, me) > .1)) renderList("Near you", listItems());
  }, err => {
    watchId = null;
    toast(err.code === 1 ? "Location is blocked. Allow it in Settings" : "Couldn't find your location");
  }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
function centerMe(){
  if (!inFukui()){ toast(`You're ${fmtDist(dist(me, FUKUI_STN))} from Fukui`); return; }
  map && map.flyTo({center: [me.lon, me.lat], zoom: 15, duration: 900});
}

let tt;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }

const q = document.getElementById("q");
q.addEventListener("focus", () => { listKind = "search"; renderList("Explore Fukui", listItems()); });
q.addEventListener("input", () => { listKind = "search"; renderList(q.value ? `Results for “${q.value}”` : "Explore Fukui", listItems()); });
document.getElementById("near-btn").onclick = () => { listKind = "near"; locate(false); renderList("Near you", listItems()); };
document.getElementById("saved-btn").onclick = () => { listKind = "saved"; renderList("Saved", listItems()); };

const TRIPS = [
  {name:"Dinosaurs & Zen", mode:"public", stops:[["eiheiji","dino","heisenji"]], blurb:"Temple morning, dinosaur afternoon"},
  {name:"Coast, castle & crab", mode:"car", stops:[["maruoka","tojinbo","crab","awara"]], blurb:"Cliffs at sunset, onsen at night"},
  {name:"Southern Wakasa", mode:"car", stops:[["kehi","mikata","kumagawa","obama"]], blurb:"Lakes, post towns and mackerel"},
  {name:"Best of Fukui", mode:"car", stops:[["yokokan","ichijodani","katsudon"],["dino","heisenji","ono"],["maruoka","tojinbo","crab","awara"]], blurb:"The highlights in three days"}
];
const MODES = {car:"🚗 Car", public:"🚃 Train & bus", both:"🚗🚃 Both"};
let plan = null, day = 0, draft = {days: 2, mode: "public"};
try { plan = JSON.parse(localStorage.getItem("vf-plan") || "null"); } catch (e) {}
function savePlan(){ try { localStorage.setItem("vf-plan", JSON.stringify(plan)); } catch (e) {} syncMarkers(); }
const P = id => PLACES.find(p => p.id === id);
function hoursAt(p){
  const t = p.time.toLowerCase();
  if (/overnight|—/.test(t)) return 0;
  if (/half day/.test(t)) return 4;
  const n = (t.match(/[\d.]+/g) || ["1"]).map(Number), v = n.reduce((a, b) => a + b, 0) / n.length;
  return /min/.test(t) ? v / 60 : v;
}
function leg(a, b, mode){
  const d = dist(a, b) * 1.3, m = mode === "both" ? (d < 12 ? "public" : "car") : mode;
  if (d < 1.6) return {h: d / 4.5, txt: `🚶 ${Math.max(3, Math.round(d / 4.5 * 60))} min walk`};
  if (m === "car") return {h: d / 38 + .08, txt: `🚗 ~${Math.round((d / 38 + .08) * 60)} min drive · ${fmtDist(d / 1.3)}`};
  return {h: d / 24 + .3, txt: `🚃 ~${Math.round((d / 24 + .3) * 60)} min by train/bus · ${fmtDist(d / 1.3)}`};
}
const fmtH = h => h < 1 ? `${Math.round(h * 60)} min` : `${(Math.round(h * 2) / 2).toString()} h`;
const addBtn = id => {
  const where = plan.stops.findIndex(d => d.includes(id));
  return where >= 0 ? `<button class="add on" id="addday">✓ In Day ${where + 1}</button>` : `<button class="add" id="addday">＋ Add to Day ${day + 1}</button>`;
};

function planStart(){
  openSheet(`<div class="shead"><h2>Plan your trip</h2><button class="x" aria-label="Close">✕</button></div>
    <p class="sub">Start from a ready-made trip, or build your own on the map.</p>
    <div class="lbl2">Ready-made trips</div>
    ${TRIPS.map((t, i) => `<button class="opt" data-t="${i}"><span class="ems">${t.stops.flat().slice(0, 3).map(id => em(P(id))).join("")}</span><span><b>${t.name}</b><em>${t.stops.length} day${t.stops.length > 1 ? "s" : ""} · ${MODES[t.mode]} · ${t.blurb}</em></span></button>`).join("")}
    <div class="lbl2">Build my own</div>
    <div class="sub" style="margin-bottom:8px">How many days?</div>
    <div class="seg" id="d-seg">${[1, 2, 3, 4, 5].map(n => `<button data-n="${n}" aria-pressed="${draft.days === n}">${n}</button>`).join("")}</div>
    <div class="sub" style="margin:14px 0 8px">How will you get around?</div>
    <div class="seg" id="m-seg">${Object.entries(MODES).map(([k, v]) => `<button data-m="${k}" aria-pressed="${draft.mode === k}">${v}</button>`).join("")}</div>
    <button class="cta" id="start" style="margin-top:18px">Start planning</button>`, "plan");
  sheet.querySelectorAll(".opt").forEach(b => b.onclick = () => { const t = TRIPS[b.dataset.t]; plan = {name: t.name, mode: t.mode, stops: t.stops.map(d => d.slice())}; day = 0; savePlan(); tripView(true); });
  sheet.querySelectorAll("#d-seg button").forEach(b => b.onclick = () => { draft.days = +b.dataset.n; planStart(); });
  sheet.querySelectorAll("#m-seg button").forEach(b => b.onclick = () => { draft.mode = b.dataset.m; planStart(); });
  document.getElementById("start").onclick = () => { plan = {name: "My Fukui trip", mode: draft.mode, stops: Array.from({length: draft.days}, () => [])}; day = 0; savePlan(); tripView(true); };
}
function tripView(fit){
  const ids = plan.stops[day], stops = ids.map(P);
  let total = 0, html = "";
  stops.forEach((p, i) => {
    if (i){ const l = leg(stops[i - 1], p, plan.mode); total += l.h; html += `<div class="leg">${l.txt}</div>`; }
    total += hoursAt(p);
    html += `<div class="stop"><span class="n">${i + 1}</span><span class="em">${em(p)}</span><button class="t" data-id="${p.id}"><b>${shortName(p)}</b><em>${p.time} · ${p.town}</em></button><span class="ctl"><button data-up="${i}" aria-label="Move up">↑</button><button data-down="${i}" aria-label="Move down">↓</button><button data-rm="${i}" aria-label="Remove">✕</button></span></div>`;
  });
  const cap = 9, pct = Math.min(100, total / cap * 100), over = total > cap;
  openSheet(`<div class="shead"><h2>${plan.name}</h2><button class="x" aria-label="Close">✕</button></div>
    <p class="sub">${plan.stops.length} day${plan.stops.length > 1 ? "s" : ""} · ${MODES[plan.mode]}</p>
    <div class="days">${plan.stops.map((d, i) => `<button data-day="${i}" aria-pressed="${i === day}">Day ${i + 1}${d.length ? ` · ${d.length}` : ""}</button>`).join("")}<button id="addd" aria-label="Add a day">＋</button></div>
    ${stops.length ? `<div class="sum"><span>Day ${day + 1}: about ${fmtH(total)}</span>${over ? '<span class="warn">Too full, move a stop</span>' : `<span style="color:var(--muted)">${fmtH(Math.max(0, cap - total))} free</span>`}</div><div class="meter ${over ? "over" : ""}"><i style="width:${pct}%"></i></div>${html}` : ""}
    <div class="hint">👆 Tap any pin on the map, then <b>＋ Add to Day ${day + 1}</b>.${plan.mode !== "car" ? " Times include waiting for trains and buses." : ""}</div>
    <button class="link" id="reset">Start a new plan</button>`, "trip");
  sheet.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = +b.dataset.day; syncMarkers(); tripView(true); });
  document.getElementById("addd").onclick = () => { plan.stops.push([]); day = plan.stops.length - 1; savePlan(); tripView(); };
  sheet.querySelectorAll(".t").forEach(b => b.onclick = () => openPlace(b.dataset.id, true));
  const mv = (i, j) => { const a = plan.stops[day]; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; savePlan(); tripView(); };
  sheet.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mv(+b.dataset.up, +b.dataset.up - 1));
  sheet.querySelectorAll("[data-down]").forEach(b => b.onclick = () => mv(+b.dataset.down, +b.dataset.down + 1));
  sheet.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { plan.stops[day].splice(+b.dataset.rm, 1); savePlan(); tripView(); });
  document.getElementById("reset").onclick = () => { plan = null; savePlan(); planStart(); };
  syncMarkers();
  if (fit && map && stops.length){
    const wide = innerWidth >= 760, b = new maplibregl.LngLatBounds();
    stops.forEach(p => b.extend([p.lon, p.lat]));
    map.fitBounds(b, {padding: {top: 150, bottom: wide ? 60 : innerHeight * .62, left: wide ? 460 : 50, right: 60}, maxZoom: 12.5, duration: 900});
  }
}
function drawRoute(){
  if (!map || !map.isStyleLoaded()) return;
  const coords = plan ? plan.stops[day].map(P).map(p => [p.lon, p.lat]) : [];
  const data = {type: "Feature", geometry: {type: "LineString", coordinates: coords.length > 1 ? coords : []}};
  const src = map.getSource("route");
  if (src) src.setData(data);
  else {
    map.addSource("route", {type: "geojson", data});
    map.addLayer({id: "route-halo", type: "line", source: "route", layout: {"line-cap": "round", "line-join": "round"}, paint: {"line-color": "#FFFFFF", "line-width": 8}});
    map.addLayer({id: "route", type: "line", source: "route", layout: {"line-cap": "round", "line-join": "round"}, paint: {"line-color": "#1F6F5C", "line-width": 4, "line-dasharray": [1.5, 1.2]}});
  }
}
document.getElementById("plan-btn").onclick = () => plan ? tripView(true) : planStart();
document.getElementById("loc-btn").onclick = () => locate(true);

buildChips();
initMap();
</script>
</body>
