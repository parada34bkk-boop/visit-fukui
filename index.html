<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visit Fukui</title>
<meta name="description" content="A calm map of Fukui, Japan: what's worth the trip, what's in season, and how to get there without a car.">
<meta name="theme-color" content="#EAF3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visit Fukui">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="fukui-shape.js"></script>
<style>
:root{
  /* layout: full-bleed map; search + filters on top; one sheet slides over the map; 4-tab bar at the bottom */
  --land:#EAF3EC; --sea:#A6D6EA; --ink:#1F3D36; --muted:#4F6E66; --soft:#F2F7F4; --card:#FFFFFF; --action:#1F6F5C;
  --must:#D9662B; --worth:#1E8A7E; --deep:#6B4FA0; --warn:#B5482A;
  --shadow:0 6px 20px rgba(31,61,54,.14);
  --font:"Nunito","M PLUS Rounded 1c",ui-rounded,system-ui,-apple-system,sans-serif;
  --nav:76px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--land);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--action);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#map{position:absolute;inset:0;z-index:0}
.maplibregl-ctrl-attrib{font-size:10px;font-family:var(--font)}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:calc(var(--nav) + var(--safe-b))}

.top{position:absolute;z-index:5;left:0;right:0;top:calc(12px + var(--safe-t));padding:0 16px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.searchrow{display:flex;gap:10px}
.search{flex:1;min-width:0;height:52px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;font-weight:700;color:var(--ink)}
.search input::placeholder{color:#8DA39C}
.brand{height:52px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;padding:0 16px;font-weight:900;font-size:15px;white-space:nowrap}
.brand b{color:var(--must)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;border-radius:18px;background:var(--card);box-shadow:0 2px 8px rgba(31,61,54,.12);padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px #fff}
.sep{flex:none;width:1px;background:#C9D9CF;margin:6px 2px}

.fab{position:absolute;z-index:5;right:16px;bottom:calc(var(--nav) + var(--safe-b) + 108px);width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--action)}
.fab.on{background:var(--action);color:#fff}

.teaser{position:absolute;z-index:5;left:16px;right:16px;bottom:calc(var(--nav) + var(--safe-b) + 14px);display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:left;max-width:520px}
.teaser .ph{width:56px;height:56px;border-radius:16px;flex:none}
.teaser .k{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--must)}
.teaser b{display:block;font-size:16px;font-weight:900}
.teaser span.s{font-size:13px;font-weight:700;color:var(--muted)}

/* pins */
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin .c{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .15s}
.pin.must .c{width:44px;height:44px;background:var(--must);border:3px solid #fff;color:#fff;box-shadow:0 4px 12px rgba(31,61,54,.28)}
.pin.worth .c{width:34px;height:34px;background:#fff;border:3px solid var(--worth);color:var(--worth);box-shadow:0 3px 8px rgba(31,61,54,.2)}
.pin.deep .c{width:18px;height:18px;background:var(--deep);border:3px solid #fff;box-shadow:0 2px 6px rgba(31,61,54,.28)}
.pin.must svg{width:22px;height:22px}.pin.worth svg{width:17px;height:17px}.pin.deep svg{display:none}
.pin .l{position:absolute;top:100%;margin-top:3px;white-space:nowrap;font-size:12px;font-weight:800;background:rgba(255,255,255,.95);padding:1px 8px;border-radius:9px;box-shadow:0 1px 4px rgba(31,61,54,.15);pointer-events:none;display:none}
.pin.must .l{display:block}
body.z11 .pin.worth .l,body.z12 .pin.deep .l{display:block}
body.far .pin.must .l{display:none}
.pin.on .c{transform:scale(1.2);box-shadow:0 0 0 6px rgba(31,61,54,.25)}
.pin.on .l{display:block;background:var(--ink);color:#fff}
.pin .n{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--action);color:#fff;font-size:11px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
.pin.inday .n{display:flex}
.pin.hide{display:none}
.me{width:22px;height:22px;border-radius:50%;background:#2F80ED;border:4px solid #fff;box-shadow:0 0 0 10px rgba(47,128,237,.18),0 2px 6px rgba(0,0,0,.25)}

/* sheet */
.sheet{position:absolute;z-index:7;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b));max-height:calc(100% - var(--nav) - var(--safe-b) - 70px - var(--safe-t));background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -6px 30px rgba(31,61,54,.16);overflow-y:auto;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet.tall{height:calc(100% - var(--nav) - var(--safe-b) - 70px - var(--safe-t))}
.sin{padding:10px 20px 24px}
.grab{width:40px;height:5px;border-radius:3px;background:#D5E0DB;margin:0 auto 10px}
.head{display:flex;align-items:flex-start;gap:10px}
.head h1,.head h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1.15;flex:1;text-wrap:balance}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.sub{color:var(--muted);font-size:13.5px;font-weight:700;margin:4px 0 10px}
.tier{display:inline-flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 9px;border-radius:8px}
.tier.must{background:var(--must)}.tier.worth{background:var(--worth)}.tier.deep{background:var(--deep)}
.photo{height:150px;border-radius:20px;margin:4px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px;font-size:11px;font-weight:800}
.photo.must{background:repeating-linear-gradient(45deg,#F6DCCB 0 12px,#FAE8DD 12px 24px);color:#8A4A26}
.photo.worth{background:repeating-linear-gradient(45deg,#CFE7E3 0 12px,#E1F0EE 12px 24px);color:#16655C}
.photo.deep{background:repeating-linear-gradient(45deg,#DED6EC 0 12px,#ECE7F4 12px 24px);color:#4E3A78}
.photo svg{width:40px;height:40px;opacity:.7}
.why{font-size:15.5px;font-weight:600;line-height:1.55;margin:10px 0 12px;color:#2C4740}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--soft);border-radius:12px;padding:6px 11px;font-size:13px;font-weight:800}
.pill.g{background:#E3F2EA;color:var(--action)}
.box{border-radius:18px;background:var(--soft);padding:14px;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.box .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.box b{font-size:14px;font-weight:900}
.tag{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:8px;white-space:nowrap}
.tag.ok{background:#E3F2EA;color:var(--action)}.tag.car{background:#F6E6DC;color:#8A4A26}.tag.chk{background:#FCE9E4;color:var(--warn)}
.box p{margin:0;font-size:14px;font-weight:700;line-height:1.5}
h3{font-size:15px;font-weight:900;margin:18px 0 8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF3F1}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--action)}
.item b{display:block;font-size:15px;font-weight:900;line-height:1.25}
.item p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--muted);line-height:1.45}
.item .now{color:var(--must);font-weight:900}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button,.acts a{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:15px;text-decoration:none}
.acts .heart{width:52px;flex:none;background:var(--soft)}
.acts .heart.on{background:#FCE4EE;color:#B5265F}
.acts .heart.on svg{fill:currentColor}
.acts .dir{flex:1;background:#E6F0EA;color:var(--ink)}
.acts .add{flex:1.3;background:var(--action);color:#fff}
.acts .add.on{background:#E3F2EA;color:var(--action)}
.note{font-size:12px;color:#8AA19A;font-weight:700;margin-top:14px;line-height:1.5}

/* lists */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid #EEF3F1;text-align:left}
.row:last-child{border-bottom:0}
.row .ic{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.row .ic.must{background:var(--must)}.row .ic.worth{background:var(--worth)}.row .ic.deep{background:var(--deep)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:900;line-height:1.25}
.row em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
.row .d{text-align:right;font-weight:900;font-size:14px;white-space:nowrap}
.row .d small{display:block;font-weight:700;font-size:11.5px;color:var(--muted)}
.cta{width:100%;height:50px;border-radius:25px;background:var(--action);color:#fff;font-weight:900;font-size:15px;margin:6px 0}
.ghost{width:100%;height:46px;border-radius:23px;background:var(--soft);font-weight:900;font-size:14px;margin:6px 0}
.tcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--soft);margin:8px 0}
.tcard b{font-size:16px;font-weight:900}
.tcard span{font-size:13px;font-weight:700;color:var(--muted)}
.tcard .pills{margin-top:4px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px 0}
.days button{flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--soft);font-weight:900;font-size:14px}
.days button[aria-pressed="true"]{background:var(--action);color:#fff}
.stop{display:flex;gap:12px}
.stop .tm{width:46px;flex:none;font-size:13.5px;font-weight:900;padding-top:12px}
.stop .bx{flex:1;padding:10px 12px;border-radius:16px;background:var(--soft);text-align:left}
.stop .bx b{font-size:15px;font-weight:900;display:block}
.stop .bx span{font-size:12.5px;font-weight:700;color:var(--muted)}
.leg{margin:0 0 0 70px;border-left:2px dashed #C9D9CF;padding:7px 0 7px 14px;font-size:12.5px;font-weight:800;color:var(--muted)}
.leg.chk{color:var(--warn)}
.mstop{display:flex;align-items:center;gap:10px;padding:8px 0}
.mstop .k{width:26px;height:26px;border-radius:13px;background:var(--action);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.mstop .tx{flex:1;min-width:0;text-align:left}
.mstop .ctl{display:flex;gap:4px}
.mstop .ctl button{width:32px;height:32px;border-radius:16px;background:var(--soft);font-weight:900}
.meter{height:10px;border-radius:5px;background:#EEF3F1;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--action);border-radius:5px}
.meter.over i{background:var(--must)}
.sum{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800}
.hint{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:700;color:#3D5A52;margin:12px 0}
.ecard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:18px;background:var(--soft);margin:8px 0}
.ecard .cal{width:52px;flex:none;border-radius:12px;background:#fff;text-align:center;padding:6px 0}
.ecard .cal b{display:block;font-size:13px;font-weight:900;line-height:1.1}
.ecard .cal span{font-size:10.5px;font-weight:800;color:var(--muted)}
.ecard .tx b{font-size:15px;font-weight:900;display:block}
.ecard .tx p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--muted);line-height:1.45}
.ecard.hot{background:#FDF1EA}
.ecard.hot .cal{background:var(--must);color:#fff}.ecard.hot .cal span{color:#FBE3D6}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:16px;padding:4px;margin:10px 0 0}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:900;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(31,61,54,.14)}
.tcard .hl{display:flex;gap:6px;margin-bottom:4px}
.tcard .hl span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tcard .hl span.must{background:var(--must)}.tcard .hl span.worth{background:var(--worth)}.tcard .hl span.deep{background:var(--deep)}
.tcard .hl svg{width:17px;height:17px}
.tcard .route{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink);margin-top:2px}
.tcard .route svg{width:17px;height:17px;color:var(--action)}
.tcard.mine{background:#E3F2EA;margin-top:12px}
.tcard .k2{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--action)}
.pill.now{background:#FDF1EA;color:#8A4A26}
.pill.warn{background:#FCE9E4;color:var(--warn)}
.mstop .k{border:0;cursor:pointer}
.mstop .k.done{background:#9DB8AE}
.mstop.isdone .tx b{color:var(--muted);text-decoration:line-through}
.teaser .tmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.teaser .go{flex:none;height:46px;padding:0 20px;border-radius:23px;background:var(--action);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;text-decoration:none}
.empty{padding:20px 4px;text-align:center;color:var(--muted);font-weight:700}

nav.tabs{position:absolute;z-index:8;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);box-shadow:0 -4px 20px rgba(31,61,54,.08);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:#7C918B}
nav.tabs button[aria-selected="true"]{color:var(--action);font-weight:900}
nav.tabs svg{width:24px;height:24px}
.toast{position:absolute;z-index:9;left:50%;top:calc(16px + var(--safe-t));transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800;text-align:center;padding:40px}
@media (min-width:760px){
  .sheet{left:16px;right:auto;width:420px;bottom:calc(var(--nav) + var(--safe-b) + 16px);border-radius:28px;margin:0}
  .sheet.tall{height:calc(100% - var(--nav) - var(--safe-b) - 100px - var(--safe-t))}
  .top{right:auto;width:460px}
  .teaser{right:auto;width:420px}
}
@media (max-width:370px){.brand{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="far">
<div id="map" aria-label="Map of Fukui"></div>

<div class="top">
  <div class="searchrow">
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search Fukui" autocomplete="off" aria-label="Search places, food and activities"></label>
    <div class="brand">Visit <b>&nbsp;Fukui</b></div>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filters"></div>
</div>

<button class="fab" id="loc" aria-label="Show my location"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 2.5l7 18-7-4-7 4z" fill="currentColor" stroke="none"/></svg></button>
<div class="teaser" id="teaser" hidden></div>

<section class="sheet" id="sheet" aria-live="polite"></section>
<div class="toast" id="toast" role="status"></div>

<nav class="tabs" role="tablist" aria-label="Main">
  <button role="tab" data-tab="explore" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Explore</button>
  <button role="tab" data-tab="near" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/></svg>Near me</button>

  <button role="tab" data-tab="now" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Now</button>
</nav>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON = {
  Dinosaurs:'<path d="M3 17c2 0 3-4 7-4 3 0 4 2 7 1l3-4-3-1-1-3h-3l-1 2"/><path d="M7 17v3M13 17v3"/>',
  Temple:'<path d="M12 3v3M8 6h8l-1 4H9z"/><path d="M6 21h12M9 10v11M15 10v11"/>',
  Shrine:'<path d="M3 6.5c3 .8 15 .8 18 0M5 10h14M7.5 7v13M16.5 7v13"/>',
  Castle:'<path d="M5 20v-8h14v8M8 12V9h8v3M10 9V6h4v3M3.5 20h17"/><path d="M7 9l5-4 5 4"/>',
  History:'<path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/>',
  Nature:'<path d="M2.5 19l6.5-10 4 6 3-4 5.5 8z"/>',
  Onsen:'<path d="M5 15c0 3 3 5 7 5s7-2 7-5"/><path d="M8 12c-1.2-1.6 1.2-2.4 0-4.2M12 12c-1.2-1.6 1.2-2.4 0-4.2M16 12c-1.2-1.6 1.2-2.4 0-4.2"/>',
  Garden:'<circle cx="12" cy="9" r="3"/><path d="M12 12v9M12 17c-2 0-4-1-5-3M12 17c2 0 4-1 5-3"/>',
  Park:'<path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/>',
  Outdoors:'<path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/>',

};
const ic = (k, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[k] || ICON.Nature}</svg>`;
const tierKey = t => t === "Must" ? "must" : t === "Worth it" ? "worth" : "deep";
const TIER_ORDER = {"Must":0, "Worth it":1, "Deep & unseen":2};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const P = id => PLACES.find(p => p.id === id);
const shortName = p => p.name.replace("Fukui Prefectural ", "").replace(" (Castle in the Sky)", "").replace(" · Rainbow Line Summit Park", "").replace(" (baikamo flowers)", "").replace(" (Seidaiji)", "").replace(" (Mt Kusuya)", "");
const FUKUI_STN = {lat: 36.062, lon: 136.223};
const thisMonth = new Date().getMonth() + 1;
const nextMonths = [1, 2].map(n => (thisMonth + n - 1) % 12 + 1);

function dist(a, b){
  const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lon - a.lon);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = d => d < 1 ? `${Math.max(10, Math.round(d * 100) * 10)} m` : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
const howLong = d => d <= 2 ? `${Math.max(1, Math.round(d * 1000 / 80))} min walk` : `~${Math.round(d / 35 * 60 + 5)} min drive`;
let me = null;
const inFukui = () => me && dist(me, FUKUI_STN) < 70;
const origin = () => inFukui() ? me : FUKUI_STN;

/* links between content */
const actsAt = id => ACTIVITIES.filter(a => a.place === id);
const foodsAt = id => FOODS.filter(f => f.places.includes(id));
const eventsAt = id => EVENTS.filter(e => e.place === id);
const isNow = e => e.months && e.months.includes(thisMonth);
const isSoon = e => e.months && nextMonths.some(m => e.months.includes(m)) && !isNow(e);

/* ---------- state ---------- */
let tab = "explore", mode = "all", selected = null, map = null, view = null, viewArg = null;
const tiers = new Set();
const pins = {};
let saved = [], myTrip = null, myDay = 0, routeDay = null;
try { saved = JSON.parse(localStorage.getItem("vf-saved") || "[]"); } catch (e) {}
try { myTrip = JSON.parse(localStorage.getItem("vf-mytrip") || "null"); } catch (e) {}

/* ---------- filters ---------- */
const MODES = [["all","Everything","Nature"],["eat","Eat","Food"],["do","Do","Do"],["events","Events","Event"]];
function buildChips(){
  const c = $("#chips");
  c.innerHTML = MODES.map(([k, label, icon]) => `<button class="chip" data-mode="${k}" aria-pressed="${mode === k}">${k === "all" ? "" : ic(icon)}${label}</button>`).join("")
    + '<span class="sep"></span>'
    + [["Must","must"],["Worth it","worth"],["Deep & unseen","deep"]].map(([t, k]) => `<button class="chip" data-tier="${t}" aria-pressed="${tiers.has(t)}"><span class="dot" style="background:var(--${k})"></span>${t}</button>`).join("");
  c.onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    if (b.dataset.mode){ mode = b.dataset.mode; }
    else { const t = b.dataset.tier; tiers.has(t) ? tiers.delete(t) : tiers.add(t); }
    buildChips(); syncPins();
    if (view === "near" || view === "search") render();
  };
}
function visible(p){
  if (tiers.size && !tiers.has(p.tier)) return false;
  if (mode === "eat") return p.type === "Food" || foodsAt(p.id).length > 0;
  if (mode === "do") return actsAt(p.id).length > 0;
  if (mode === "events") return eventsAt(p.id).length > 0;
  return true;
}

/* ---------- map ---------- */
const THEME = {land:"#EAF3EC", water:"#A6D6EA", green:"#CFE8D2", road:"#FFFFFF", casing:"#DCE8DF", rail:"#C9D9CF", building:"#DEEAE1", border:"#BFD3C6", label:"#2E5A4F", halo:"#F3F8F4"};
function theme(){
  map.getStyle().layers.forEach(l => {
    const id = l.id.toLowerCase(), set = (k, v) => { try { map.setPaintProperty(l.id, k, v); } catch (e) {} }, lay = (k, v) => { try { map.setLayoutProperty(l.id, k, v); } catch (e) {} };
    if (l.type === "background") set("background-color", THEME.land);
    else if (l.type === "fill"){
      if (/water|ocean|lake|river|sea/.test(id)) set("fill-color", THEME.water);
      else if (/park|wood|forest|grass|scrub|landcover|green|cemetery|golf|nature/.test(id)){ set("fill-color", THEME.green); set("fill-opacity", .85); }
      else if (/building/.test(id)){ set("fill-color", THEME.building); set("fill-outline-color", THEME.building); }
      else if (/landuse|residential|industrial|commercial|school|hospital|aeroway/.test(id)) set("fill-color", THEME.land);
    } else if (l.type === "fill-extrusion") lay("visibility", "none");
    else if (l.type === "line"){
      if (/water|river|stream|canal|ditch/.test(id)) set("line-color", THEME.water);
      else if (/casing|outline/.test(id)) set("line-color", THEME.casing);
      else if (/rail|transit/.test(id)) set("line-color", THEME.rail);
      else if (/boundary|admin/.test(id)) set("line-color", THEME.border);
      else if (/road|highway|street|path|motorway|trunk|primary|secondary|tertiary|minor|service|bridge|tunnel|track/.test(id)) set("line-color", THEME.road);
    } else if (l.type === "symbol"){
      if (/poi|housenum|aerodrome|airport|mountain_peak/.test(id)) return lay("visibility", "none");
      if (l.layout && l.layout["text-field"]){
        lay("text-field", ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"]]);
        set("text-color", THEME.label); set("text-halo-color", THEME.halo); set("text-halo-width", 1.4);
      }
      if (l.layout && l.layout["icon-image"] && /road|shield|highway/.test(id)) lay("visibility", "none");
    }
  });
}
function initMap(){
  if (!window.maplibregl){ $("#map").innerHTML = '<div class="nomap">The map could not load. Check your connection and try again.</div>'; return; }
  map = new maplibregl.Map({container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [136.25, 35.95], zoom: 8.5, minZoom: 7, maxZoom: 18, attributionControl: {compact: true}, maxBounds: [[134.2, 34.3], [138.1, 37.4]]});
  map.on("style.load", theme);
  map.on("load", () => { addFukuiShape(); fitAll(0); drawRoute(); });
  map.on("zoom", zoomClass);
  map.on("click", e => { if (!e.originalEvent.target.closest(".pin")) { if (view === "place") closeSheet(); } });
  PLACES.forEach(p => {
    const el = document.createElement("button");
    el.className = "pin " + tierKey(p.tier);
    el.setAttribute("aria-label", `${p.name}, ${p.tier}`);
    el.innerHTML = `<span class="c">${ic(p.type)}<span class="n"></span></span><span class="l">${esc(shortName(p))}</span>`;
    el.addEventListener("click", ev => { ev.stopPropagation(); openPlace(p.id, true); });
    pins[p.id] = {el, m: new maplibregl.Marker({element: el, anchor: "center"}).setLngLat([p.lon, p.lat]).addTo(map)};
  });
  zoomClass(); syncPins();
}
function addFukuiShape(){
  if (typeof FUKUI_OUTLINE === "undefined" || map.getSource("fukui")) return;
  const firstLabel = (map.getStyle().layers.find(l => l.type === "symbol") || {}).id;
  map.addSource("fukui-mask", {type: "geojson", data: FUKUI_MASK});
  map.addSource("fukui", {type: "geojson", data: FUKUI_OUTLINE});
  /* soften everything outside Fukui so the prefecture reads as one place */
  map.addLayer({id: "fukui-mask", type: "fill", source: "fukui-mask", paint: {"fill-color": "#E6EAE8", "fill-opacity": ["interpolate", ["linear"], ["zoom"], 7, .8, 11, .55, 14, .3]}}, firstLabel);
  map.addLayer({id: "fukui-edge-halo", type: "line", source: "fukui", layout: {"line-join": "round"}, paint: {"line-color": "#FFFFFF", "line-width": ["interpolate", ["linear"], ["zoom"], 7, 4, 12, 7], "line-opacity": .9}}, firstLabel);
  map.addLayer({id: "fukui-edge", type: "line", source: "fukui", layout: {"line-join": "round"}, paint: {"line-color": "#1F6F5C", "line-width": ["interpolate", ["linear"], ["zoom"], 7, 1.6, 12, 2.6], "line-opacity": .75, "line-dasharray": [3, 2]}}, firstLabel);
}
function fitAll(duration = 800){
  if (!map) return;
  const wide = innerWidth >= 760;
  map.fitBounds([[135.45, 35.34], [136.83, 36.3]], {padding: {top: 130, bottom: wide ? 40 : 110, left: wide ? 470 : 8, right: 8}, duration});
}
function zoomClass(){
  const z = map ? map.getZoom() : 8;
  document.body.classList.toggle("far", z < 8.7);
  document.body.classList.toggle("z11", z >= 10.5);
  document.body.classList.toggle("z12", z >= 12);
}
function syncPins(){
  const dayIds = routeDay ? routeDay.ids : [];
  PLACES.forEach(p => {
    const pin = pins[p.id]; if (!pin) return;
    const k = dayIds.indexOf(p.id);
    pin.el.classList.toggle("hide", !visible(p) && selected !== p.id && k < 0);
    pin.el.classList.toggle("on", selected === p.id);
    pin.el.classList.toggle("inday", k >= 0);
    pin.el.querySelector(".n").textContent = k >= 0 ? k + 1 : "";
    pin.el.style.zIndex = selected === p.id ? 20 : k >= 0 ? 15 : TIER_ORDER[p.tier] === 0 ? 3 : TIER_ORDER[p.tier] === 1 ? 2 : 1;
  });
}
function flyTo(p, z = 13){
  if (!map) return;
  const wide = innerWidth >= 760;
  map.flyTo({center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), z), offset: [wide ? 220 : 0, wide ? 0 : -innerHeight * .22], duration: 900});
}
function drawRoute(){
  if (!map || !map.isStyleLoaded()) return;
  const coords = routeDay ? routeDay.ids.map(P).filter(Boolean).map(p => [p.lon, p.lat]) : [];
  const data = {type: "Feature", geometry: {type: "LineString", coordinates: coords.length > 1 ? coords : []}};
  const src = map.getSource("route");
  if (src) src.setData(data);
  else {
    map.addSource("route", {type: "geojson", data});
    map.addLayer({id: "route-halo", type: "line", source: "route", layout: {"line-cap": "round", "line-join": "round"}, paint: {"line-color": "#FFFFFF", "line-width": 8}});
    map.addLayer({id: "route", type: "line", source: "route", layout: {"line-cap": "round", "line-join": "round"}, paint: {"line-color": "#1F6F5C", "line-width": 4, "line-dasharray": [1.5, 1.2]}});
  }
}
function showRoute(ids, label){
  routeDay = ids && ids.length ? {ids: [...new Set(ids)], label} : null;
  drawRoute(); syncPins();
  if (routeDay && map){
    const b = new maplibregl.LngLatBounds();
    routeDay.ids.map(P).forEach(p => b.extend([p.lon, p.lat]));
    const wide = innerWidth >= 760;
    map.fitBounds(b, {padding: {top: 150, bottom: wide ? 60 : innerHeight * .55, left: wide ? 470 : 50, right: 60}, maxZoom: 12.5, duration: 900});
  }
}

/* ---------- sheet ---------- */
const sheet = $("#sheet");
function openSheet(html, tall){
  sheet.innerHTML = `<div class="sin"><div class="grab"></div>${html}</div>`;
  sheet.classList.add("open"); sheet.classList.toggle("tall", !!tall); sheet.scrollTop = 0;
  $("#teaser").hidden = true;
  sheet.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  sheet.querySelectorAll("[data-place]").forEach(b => b.onclick = () => openPlace(b.dataset.place, true));
}
function closeSheet(){
  if (view === "place" && back){ const b = back; back = null; return b(); }
  sheet.classList.remove("open"); view = null; selected = null; syncPins();
  if (tab !== "explore") setTab("explore", true);
  updateTeaser();
}
let back = null;
const closeBtn = '<button class="x" data-close aria-label="Close">' + ic("X") + '</button>';

function placeRow(p, d){
  return `<button class="row" data-place="${p.id}"><span class="ic ${tierKey(p.tier)}">${ic(p.type)}</span><span class="tx"><b>${esc(shortName(p))}</b><em>${esc(p.tier)} · ${esc(p.type)} · ${esc(p.area)}</em></span>${d !== undefined ? `<span class="d">${fmtDist(d)}<small>${howLong(d)}</small></span>` : ""}</button>`;
}

/* place card */
function openPlace(id, fly){
  const p = P(id); if (!p) return;
  if (view && view !== "place"){ const v = view, a = viewArg; back = () => { view = null; show(v, a); }; }
  view = "place"; selected = id; syncPins();
  if (fly) flyTo(p);
  const tk = tierKey(p.tier), d = dist(origin(), p), here = inFukui();
  const carOnly = /^car|car best|car or taxi|^car\./i.test(p.access) || p.access.startsWith("Car");
  const unverified = /\(check/i.test(p.access);
  const acts = actsAt(id), foods = foodsAt(id), evs = eventsAt(id);
  const inTrip = myTrip && myTrip.days.some(dd => dd.includes(id));
  const on = saved.includes(id);
  const gmaps = gmapsUrl(p);
  openSheet(`
    <div class="head"><div style="flex:1"><span class="tier ${tk}">${esc(p.tier)}</span></div>${closeBtn}</div>
    <div class="photo ${tk}">${ic(p.type)}<span>Photo coming soon</span></div>
    <div class="head"><h1>${esc(p.name)}</h1></div>
    <div class="sub">${esc(p.jp)} · ${esc(p.area)}</div>
    <div class="pills"><span class="pill g">${fmtDist(d)} ${here ? "away" : "from Fukui Stn"}</span><span class="pill">${esc(p.best)}</span></div>
    <p class="why">${esc(p.why)}</p>
    <div class="box">
      <div class="t"><b>${carOnly ? "Getting there" : "Without a car"}</b>${unverified ? '<span class="tag chk">Not checked yet</span>' : carOnly ? '<span class="tag car">Best by car</span>' : '<span class="tag ok">No car needed</span>'}</div>
      <p>${esc(p.access.replace(/\s*\(check[^)]*\)/gi, ""))}</p>
    </div>
    ${acts.length ? `<h3>Things to do here</h3>${acts.map(a => `<div class="item"><span class="ic">${ic("Do")}</span><div><b>${esc(a.name)}</b><p>${esc(a.what)} ${esc(a.note)}</p></div></div>`).join("")}` : ""}
    ${foods.length ? `<h3>Eat here</h3>${foods.map(f => `<div class="item"><span class="ic">${ic("Food")}</span><div><b>${esc(f.name)} <span style="color:var(--muted);font-weight:700">${esc(f.jp)}</span></b><p>${esc(f.what)}${f.months && f.months.includes(thisMonth) ? ' <span class="now">In season now.</span>' : ""}</p></div></div>`).join("")}` : ""}
    ${evs.length ? `<h3>Events here</h3>${evs.map(e => `<div class="item"><span class="ic">${ic("Event")}</span><div><b>${esc(e.name)}</b><p>${isNow(e) ? '<span class="now">This month.</span> ' : ""}${esc(e.when)}. ${esc(e.note)}</p></div></div>`).join("")}` : ""}
    <div class="acts">
      <button class="heart ${on ? "on" : ""}" id="save" aria-label="${on ? "Remove from saved" : "Save"}" aria-pressed="${on}">${ic("Heart")}</button>
      <a class="dir" href="${gmaps}" target="_blank" rel="noopener">Directions</a>
      <button class="add ${inTrip ? "on" : ""}" id="add">${inTrip ? "In your trip" : myTrip ? `Add to Day ${myDay + 1}` : "Add to trip"}</button>
    </div>
    <p class="note">Pin positions are approximate and opening hours aren't listed yet. Check before you go. Directions open Google Maps.</p>`);
  $("#save").onclick = () => { saved.includes(id) ? saved = saved.filter(x => x !== id) : saved.push(id); persist(); toast(saved.includes(id) ? "Saved" : "Removed from saved"); openPlace(id); };
  $("#add").onclick = () => {
    if (!myTrip){ myTrip = {name: "My Fukui trip", from: null, done: [], days: [[]]}; myDay = 0; }
    const where = myTrip.days.findIndex(dd => dd.includes(id));
    if (where >= 0){ myTrip.days[where] = myTrip.days[where].filter(x => x !== id); toast(`Removed from Day ${where + 1}`); }
    else { myTrip.days[myDay].push(id); toast(`Added to Day ${myDay + 1}`); }
    persist(); openPlace(id);
  };
}

/* near me + search */
function nearView(){
  const o = origin();
  const list = PLACES.filter(visible).map(p => ({p, d: dist(o, p)})).sort((a, b) => a.d - b.d).slice(0, 25);
  const note = inFukui() ? "Distance from where you are" : me ? "You're outside Fukui, so distances are from Fukui Station" : "Distances from Fukui Station";
  return `<div class="head"><h2>Near me</h2>${closeBtn}</div><p class="sub">${note}</p>
    ${me ? "" : '<button class="cta" id="useloc">Use my location</button>'}
    ${list.length ? list.map(({p, d}) => placeRow(p, d)).join("") : '<div class="empty">Nothing matches these filters.</div>'}`;
}
function searchView(q){
  const t = q.toLowerCase();
  const hit = s => String(s || "").toLowerCase().includes(t);
  const ps = PLACES.filter(p => visible(p) && (hit(p.name) || hit(p.jp) || hit(p.area) || hit(p.type) || foodsAt(p.id).some(f => hit(f.name)) || actsAt(p.id).some(a => hit(a.name))));
  const o = origin();
  return `<div class="head"><h2>${q ? `“${esc(q)}”` : "Search"}</h2>${closeBtn}</div><p class="sub">Places, food and things to do</p>
    ${ps.length ? ps.map(p => placeRow(p, dist(o, p))).join("") : '<div class="empty">No matches. Try another word, or clear the filters.</div>'}`;
}

/* trips */
let tf = {days: "1", car: false};
try { Object.assign(tf, JSON.parse(localStorage.getItem("vf-tf") || "{}")); } catch (e) {}
const saveTf = () => { try { localStorage.setItem("vf-tf", JSON.stringify(tf)); } catch (e) {} };
const nDays = t => parseInt(t.length, 10);
const bucket = t => nDays(t) >= 3 ? "3" : String(nDays(t));
const isCar = t => t.mode === "Rental car";
const tripPlaces = t => [...new Set(t.stops.map(s => s.place).filter(Boolean))].map(P).filter(Boolean);
const stripCheck = s => String(s || "").replace(/\s*\(check[^)]*\)/gi, "");
function tripNotes(t){
  const ids = new Set(tripPlaces(t).map(p => p.id).filter(id => id !== "city"));
  const now = [];
  EVENTS.forEach(e => { if (isNow(e) && e.place && ids.has(e.place) && e.tier !== "Deep & unseen") now.push(e.name); });
  FOODS.forEach(f => { if (f.months && f.months.includes(thisMonth) && f.tier !== "Deep & unseen" && f.places.some(id => ids.has(id))) now.push(f.name); });
  const warn = [...new Set(t.stops.filter(s => s.months && !s.months.includes(thisMonth)).map(s => s.warn))];
  return {now: [...new Set(now)].slice(0, 2), warn};
}
function tripCard({t, i}){
  const hi = tripPlaces(t).sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier]).slice(0, 4);
  const n = tripNotes(t);
  return `<button class="tcard" data-trip="${i}">
    <span class="hl">${hi.map(p => `<span class="${tierKey(p.tier)}" title="${esc(shortName(p))}">${ic(p.type)}</span>`).join("")}</span>
    <b>${esc(t.name)}</b><span>${esc(t.blurb)}</span>
    <span class="route">${ic(isCar(t) ? "Car" : "Train")}${esc(t.start)} → ${esc(t.end)}</span>
    ${n.now.length || n.warn.length ? `<span class="pills">${n.now.map(x => `<span class="pill now">${MONTHS[thisMonth - 1]}: ${esc(x)}</span>`).join("")}${n.warn.map(x => `<span class="pill warn">${esc(x)}</span>`).join("")}</span>` : ""}
  </button>`;
}
const seg = (key, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-${key}="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
function tripProgress(){
  if (!myTrip) return null;
  myTrip.done = myTrip.done || [];
  const all = myTrip.days.flatMap((d, k) => d.map(id => k + ":" + id));
  return {total: all.length, done: all.filter(x => myTrip.done.includes(x)).length};
}
function tripsView(){
  const all = TRIPS.map((t, i) => ({t, i}));
  const exact = all.filter(x => bucket(x.t) === tf.days && isCar(x.t) === tf.car);
  let extra = [], extraTitle = "";
  if (tf.car){ extra = all.filter(x => bucket(x.t) === tf.days && !isCar(x.t)); extraTitle = "These work with a car too"; }
  else if (tf.days !== "1"){ extra = all.filter(x => !isCar(x.t) && +bucket(x.t) < +tf.days); extraTitle = "Or put shorter trips together"; }
  if (!exact.length && !extra.length){ extra = all.filter(x => isCar(x.t) === tf.car); extraTitle = "Closest matches"; }
  const pr = tripProgress();
  return `<div class="head"><h2>Trips</h2>${closeBtn}</div>
    ${myTrip ? `<button class="tcard mine" id="mine"><span class="k2">Your trip</span><b>${esc(myTrip.name)}</b><span>${myTrip.days.length} day${myTrip.days.length > 1 ? "s" : ""} · ${pr.done} of ${pr.total} stops done</span></button>` : ""}
    ${seg("days", [["1", "1 day"], ["2", "2 days"], ["3", "3+ days"]], tf.days)}
    ${seg("car", [["0", "No car"], ["1", "Rental car"]], tf.car ? "1" : "0")}
    ${exact.map(tripCard).join("")}
    ${extra.length ? `<h3>${extraTitle}</h3>${extra.map(tripCard).join("")}` : ""}
    <button class="ghost" id="scratch" style="margin-top:14px">Start from scratch instead</button>
    ${saved.length ? `<h3>Saved places (${saved.length})</h3>${saved.map(P).filter(Boolean).map(p => placeRow(p)).join("")}` : ""}`;
}
function tripView(i, day = 1){
  const t = TRIPS[i];
  const days = [...new Set(t.stops.map(s => s.day))];
  const stops = t.stops.filter(s => s.day === day);
  const n = tripNotes(t);
  let html = "";
  stops.forEach((s, k) => {
    if (k) { const chk = /\(check/i.test(s.how); html += `<div class="leg ${chk ? "chk" : ""}">${esc(stripCheck(s.how))}${chk ? " · not checked yet" : ""}</div>`; }
    const off = s.months && !s.months.includes(thisMonth);
    html += `<div class="stop"><span class="tm">${esc(s.time)}</span>${s.place ? `<button class="bx" data-place="${s.place}">` : '<div class="bx">'}<b>${esc(s.stop)}</b>${k === 0 && s.how ? `<span>${esc(stripCheck(s.how))}</span><br>` : ""}${s.tip ? `<span>${esc(s.tip)}</span>` : ""}${off ? `<br><span style="color:var(--warn);font-weight:900">Not on in ${MONTH_LONG[thisMonth - 1]}</span>` : ""}${s.place ? "</button>" : "</div>"}</div>`;
  });
  return `<div class="head"><button class="x" id="tback" aria-label="Back to trips">${ic("Back")}</button><h2>${esc(t.name)}</h2>${closeBtn}</div>
    <div class="pills" style="margin:10px 0 0"><span class="pill">${esc(t.length)}</span><span class="pill ${isCar(t) ? "" : "g"}">${isCar(t) ? "Rental car" : "No car needed"}</span><span class="pill">${esc(t.start)} → ${esc(t.end)}</span>${n.now.map(x => `<span class="pill now">${MONTHS[thisMonth - 1]}: ${esc(x)}</span>`).join("")}</div>
    ${days.length > 1 ? `<div class="days">${days.map(d => `<button data-day="${d}" aria-pressed="${d === day}">Day ${d}</button>`).join("")}</div>` : '<div style="height:12px"></div>'}
    ${html}
    <div class="hint">Times are a rough plan. Anything marked "not checked yet" needs checking before you go.</div>
    <button class="cta" id="usetrip">Use this trip</button>
    <p class="note" style="text-align:center;margin-top:6px">You can change the stops after.</p>`;
}
function myTripView(){
  if (!myTrip) return tripsView();
  myTrip.done = myTrip.done || [];
  if (myDay >= myTrip.days.length) myDay = 0;
  const ids = myTrip.days[myDay];
  let h = 0, html = "";
  ids.forEach((id, k) => {
    const p = P(id); if (!p) return;
    if (k){ const prev = P(ids[k - 1]), d = dist(prev, p) * 1.3, hr = d < 1.6 ? d / 4.5 : d / 30 + .2; h += hr; html += `<div class="leg">~${Math.max(3, Math.round(hr * 60))} min · ${fmtDist(d / 1.3)}</div>`; }
    h += 1.5;
    const done = myTrip.done.includes(myDay + ":" + id);
    html += `<div class="mstop ${done ? "isdone" : ""}"><button class="k ${done ? "done" : ""}" data-done="${id}" aria-label="${done ? "Mark as not done" : "Mark as done"}" aria-pressed="${done}">${done ? "✓" : k + 1}</button><button class="tx" data-place="${id}"><b style="font-size:15px;font-weight:900">${esc(shortName(p))}</b><br><span style="font-size:12.5px;font-weight:700;color:var(--muted)">${esc(p.area)}</span></button><span class="ctl"><button data-up="${k}" aria-label="Move up">↑</button><button data-down="${k}" aria-label="Move down">↓</button><button data-rm="${k}" aria-label="Remove">✕</button></span></div>`;
  });
  const over = h > 9;
  return `<div class="head"><button class="x" id="tback" aria-label="Back to trips">${ic("Back")}</button><h2>${esc(myTrip.name)}</h2>${closeBtn}</div>
    <div class="days">${myTrip.days.map((d, k) => `<button data-mday="${k}" aria-pressed="${k === myDay}">Day ${k + 1}${d.length ? " · " + d.length : ""}</button>`).join("")}<button id="addday" aria-label="Add a day">+</button></div>
    ${ids.length ? `<div class="sum"><span>Day ${myDay + 1}: about ${Math.round(h * 2) / 2} h</span><span style="color:${over ? "var(--must)" : "var(--muted)"}">${over ? "Too full" : `${Math.round((9 - h) * 2) / 2} h free`}</span></div><div class="meter ${over ? "over" : ""}"><i style="width:${Math.min(100, h / 9 * 100)}%"></i></div>${html}` : '<div class="empty">No stops on this day yet.</div>'}
    <div class="hint">Tap a number when you've been there. To add a stop, tap any pin on the map, then <b>Add to Day ${myDay + 1}</b>.</div>
    ${myTrip.from != null && TRIPS[myTrip.from] ? `<button class="ghost" id="orig">See the original plan with times</button>` : ""}
    <button class="ghost" id="clear">Delete this trip</button>`;
}
function replaceOk(){
  const pr = tripProgress();
  return !pr || !pr.total || confirm("Replace your current trip?");
}
function newTripFrom(i){
  const t = TRIPS[i], days = [...new Set(t.stops.map(s => s.day))];
  myTrip = {name: t.name, from: i, done: [], days: days.map(d => [...new Set(t.stops.filter(s => s.day === d && s.place).map(s => s.place))])};
  myDay = 0; persist();
}
function nextStop(){
  if (!myTrip) return null;
  myTrip.done = myTrip.done || [];
  for (let d = myDay; d < myTrip.days.length; d++){
    const id = myTrip.days[d].find(x => !myTrip.done.includes(d + ":" + x));
    if (id) return {day: d, p: P(id)};
  }
  return null;
}
const gmapsUrl = p => {
  const d = dist(origin(), p);
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.jp + " " + p.area.split(" (")[0])}&travelmode=${inFukui() && d < 2 ? "walking" : "transit"}`;
};

/* now */
function nowView(){
  const now = EVENTS.filter(isNow).sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier]);
  const soon = EVENTS.filter(isSoon).sort((a, b) => a.months.indexOf(nextMonths[0]) - b.months.indexOf(nextMonths[0]));
  const foods = FOODS.filter(f => f.months && f.months.includes(thisMonth));
  const ecard = (e, hot) => `<${e.place ? `button data-place="${e.place}"` : "div"} class="ecard ${hot ? "hot" : ""}"><span class="cal"><b>${esc(MONTHS[(hot ? thisMonth : e.months.find(m => nextMonths.includes(m))) - 1])}</b><span>${esc(e.tier === "Must" ? "MUST" : e.tier === "Worth it" ? "WORTH IT" : "DEEP")}</span></span><span class="tx"><b>${esc(e.name)}</b><p>${esc(e.when)} · ${esc(e.where)}. ${esc(e.note)}</p>${e.latest && !/every|check/i.test(e.latest) ? `<p style="font-weight:800">Latest: ${esc(e.latest)}</p>` : ""}</span></${e.place ? "button" : "div"}>`;
  return `<div class="head"><h2>Now in Fukui</h2>${closeBtn}</div><p class="sub">${MONTH_LONG[thisMonth - 1]}. Dates change each year, so check before you go.</p>
    ${now.length ? now.map(e => ecard(e, true)).join("") : '<div class="empty">Nothing special listed this month.</div>'}
    ${foods.length ? `<h3>In season to eat</h3>${foods.map(f => `<div class="item"><span class="ic">${ic("Food")}</span><div><b>${esc(f.name)} <span style="color:var(--muted);font-weight:700">${esc(f.jp)}</span></b><p>${esc(f.what)} ${esc(f.where)}.</p>${f.places.length ? `<p>${f.places.map(id => `<button data-place="${id}" style="color:var(--action);font-weight:900;font-size:13px;margin-right:10px">${esc(shortName(P(id)))}</button>`).join("")}</p>` : ""}</div></div>`).join("")}` : ""}
    ${soon.length ? `<h3>Coming up</h3>${soon.map(e => ecard(e, false)).join("")}` : ""}`;
}

/* router */
function show(v, arg){
  view = v; viewArg = arg; selected = v === "place" ? selected : null; syncPins();
  if (v === "near") openSheet(nearView(), true);
  else if (v === "search") openSheet(searchView(arg || ""), true);
  else if (v === "trips") openSheet(tripsView(), true);
  else if (v === "trip") openSheet(tripView(arg.i, arg.day), true);
  else if (v === "mytrip") openSheet(myTripView(), true);
  else if (v === "now") openSheet(nowView(), true);
  bind();
}
function render(){ if (view && view !== "place") show(view, viewArg); }
function bind(){
  const u = $("#useloc"); if (u) u.onclick = () => locate(true);
  sheet.querySelectorAll("[data-trip]").forEach(b => b.onclick = () => { show("trip", {i: +b.dataset.trip, day: 1}); previewTrip(+b.dataset.trip, 1); });
  sheet.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { tf.days = b.dataset.days; saveTf(); show("trips"); });
  sheet.querySelectorAll("[data-car]").forEach(b => b.onclick = () => { tf.car = b.dataset.car === "1"; saveTf(); show("trips"); });
  const mine = $("#mine"); if (mine) mine.onclick = () => openMyTrip();
  const tb = $("#tback"); if (tb) tb.onclick = () => { showRoute(null); show("trips"); };
  sheet.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { const d = +b.dataset.day; show("trip", {i: viewArg.i, day: d}); previewTrip(viewArg.i, d); });
  const ut = $("#usetrip"); if (ut) ut.onclick = () => { if (!replaceOk()) return; newTripFrom(viewArg.i); toast("This is your trip now"); openMyTrip(); };
  const sc = $("#scratch"); if (sc) sc.onclick = () => {
    if (!replaceOk()) return;
    myTrip = {name: "My Fukui trip", from: null, done: [], days: Array.from({length: +tf.days}, () => [])};
    myDay = 0; persist(); openMyTrip();
  };
  const og = $("#orig"); if (og) og.onclick = () => { show("trip", {i: myTrip.from, day: myDay + 1}); previewTrip(myTrip.from, myDay + 1); };
  sheet.querySelectorAll("[data-mday]").forEach(b => b.onclick = () => { myDay = +b.dataset.mday; openMyTrip(); });
  const ad = $("#addday"); if (ad) ad.onclick = () => { myTrip.days.push([]); myDay = myTrip.days.length - 1; persist(); show("mytrip"); showRoute(null); };
  const mv = (i, j) => { const a = myTrip.days[myDay]; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; persist(); openMyTrip(); };
  sheet.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mv(+b.dataset.up, +b.dataset.up - 1));
  sheet.querySelectorAll("[data-down]").forEach(b => b.onclick = () => mv(+b.dataset.down, +b.dataset.down + 1));
  sheet.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { myTrip.days[myDay].splice(+b.dataset.rm, 1); persist(); openMyTrip(); });
  sheet.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const key = myDay + ":" + b.dataset.done;
    myTrip.done = myTrip.done.includes(key) ? myTrip.done.filter(x => x !== key) : [...myTrip.done, key];
    persist(); show("mytrip");
  });
  const cl = $("#clear"); if (cl) cl.onclick = () => { if (!confirm("Delete this trip?")) return; myTrip = null; persist(); showRoute(null); toast("Trip deleted"); show("trips"); };
}
function openMyTrip(){ setTab("trips", true); show("mytrip"); showRoute(myTrip.days[myDay], "mine"); }
function previewTrip(i, day){ showRoute(TRIPS[i].stops.filter(s => s.day === day && s.place).map(s => s.place), "preview"); }

function setTab(t, quiet){
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  if (quiet) return;
  back = null;
  if (t === "explore"){ sheet.classList.remove("open"); view = null; selected = null; showRoute(null); syncPins(); updateTeaser(); }
  else if (t === "near"){ locate(false); show("near"); }
  else if (t === "trips"){ show("trips"); }
  else if (t === "now"){ show("now"); }
}

/* bar on the map: your next stop, or what's on now */
function updateTeaser(){
  const t = $("#teaser");
  if (sheet.classList.contains("open")){ t.hidden = true; return; }
  const nx = nextStop(), pr = tripProgress();
  if (nx && nx.p){
    t.hidden = false;
    t.innerHTML = `<button class="tmain" id="tmain"><span class="ph photo ${tierKey(nx.p.tier)}" style="margin:0;height:56px;padding:0;align-items:center;justify-content:center">${ic(nx.p.type)}</span><span style="flex:1;min-width:0"><span class="k" style="color:var(--action)">Your trip · Day ${nx.day + 1}</span><b>Next: ${esc(shortName(nx.p))}</b><span class="s">${pr.done} of ${pr.total} done</span></span></button><a class="go" href="${gmapsUrl(nx.p)}" target="_blank" rel="noopener">Go</a>`;
    $("#tmain").onclick = () => { myDay = nx.day; openMyTrip(); };
    return;
  }
  if (pr && pr.total && !nx){
    t.hidden = false;
    t.innerHTML = `<button class="tmain" id="tmain"><span class="ph photo worth" style="margin:0;height:56px;padding:0;align-items:center;justify-content:center">${ic("Do")}</span><span style="flex:1;min-width:0"><span class="k" style="color:var(--action)">Your trip</span><b>All ${pr.total} stops done</b><span class="s">Nice. Tap to see your trip</span></span></button>`;
    $("#tmain").onclick = () => openMyTrip();
    return;
  }
  const e = EVENTS.filter(isNow).sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier])[0];
  if (!e){ t.hidden = true; return; }
  t.hidden = false;
  t.innerHTML = `<button class="tmain" id="tmain"><span class="ph photo ${tierKey(e.tier)}" style="margin:0;height:56px;padding:0;align-items:center;justify-content:center">${ic("Event")}</span><span style="flex:1;min-width:0"><span class="k">Now in Fukui</span><b>${esc(e.name)}</b><span class="s">${esc(e.when)}</span></span>${ic("Back").replace('class="i"', 'class="i" style="transform:rotate(180deg);color:var(--muted)"')}</button>`;
  $("#tmain").onclick = () => setTab("now");
}

/* location */
let meMarker = null, watchId = null;
function locate(center){
  if (!navigator.geolocation){ toast("Location isn't available here"); return; }
  if (watchId !== null){ if (center && me) centerMe(); return; }
  if (center) toast("Finding you…");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const prev = me;
    me = {lat: pos.coords.latitude, lon: pos.coords.longitude};
    $("#loc").classList.add("on");
    if (map){
      if (!meMarker){ const el = document.createElement("div"); el.className = "me"; meMarker = new maplibregl.Marker({element: el}).setLngLat([me.lon, me.lat]).addTo(map); }
      else meMarker.setLngLat([me.lon, me.lat]);
    }
    if (first && center) centerMe();
    first = false;
    if (view === "near" && (!prev || dist(prev, me) > .1)) render();
  }, err => { watchId = null; toast(err.code === 1 ? "Location is blocked. Allow it in Settings" : "Couldn't find your location"); }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
function centerMe(){
  if (!inFukui()){ toast(`You're ${fmtDist(dist(me, FUKUI_STN))} from Fukui`); return; }
  map && map.flyTo({center: [me.lon, me.lat], zoom: 14, duration: 900});
}

let tt;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }

/* wire up */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#loc").onclick = () => locate(true);
const q = $("#q");
q.addEventListener("focus", () => { setTab("explore", true); show("search", q.value); });
q.addEventListener("input", () => show("search", q.value));
addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });
addEventListener("resize", () => map && map.resize());
buildChips();
initMap();
updateTeaser();
</script>
</body>
</html>
