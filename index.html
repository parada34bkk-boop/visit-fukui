<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visit Fukui</title>
<meta name="description" content="A calm map of Fukui, Japan: what's worth the trip, what's in season, and how to get there without a car.">
<meta name="theme-color" content="#EAF3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visit Fukui">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="data.js?v=c8097f4"></script>
<script src="fukui-shape.js?v=c8097f4"></script>
<style>
:root{
  /* layout: full-bleed map; search + filters on top; one sheet slides over the map; 4-tab bar at the bottom */
  --land:#EAF3EC; --sea:#A6D6EA; --ink:#1F3D36; --muted:#4F6E66; --soft:#F2F7F4; --card:#FFFFFF; --action:#1F6F5C;
  --must:#C8364F; --worth:#1E8A7E; --deep:#6B4FA0; --warn:#A8333F;
  --shadow:0 6px 20px rgba(31,61,54,.14);
  --font:"Nunito","M PLUS Rounded 1c",ui-rounded,system-ui,-apple-system,sans-serif;
  --nav:76px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--land);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--action);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#map{position:absolute;inset:0;z-index:0}
.maplibregl-ctrl-attrib{font-size:10px;font-family:var(--font)}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:calc(var(--nav) + var(--safe-b))}

.top{position:absolute;z-index:5;left:0;right:0;top:calc(12px + var(--safe-t));padding:0 16px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.searchrow{display:flex;gap:10px}
.search{flex:1;min-width:0;height:52px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;font-weight:700;color:var(--ink)}
.search input::placeholder{color:#8DA39C}
.brand{height:52px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;padding:0 16px;font-weight:900;font-size:15px;white-space:nowrap}
.brand b{color:var(--must)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;border-radius:18px;background:var(--card);box-shadow:0 2px 8px rgba(31,61,54,.12);padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px #fff}
.sep{flex:none;width:1px;background:#C9D9CF;margin:6px 2px}

.fab{position:absolute;z-index:5;right:16px;bottom:calc(var(--nav) + var(--safe-b) + 146px);width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--action)}
.fab.on{background:var(--action);color:#fff}

.teaser{position:absolute;z-index:5;left:16px;right:16px;bottom:calc(var(--nav) + var(--safe-b) + 14px);display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:left;max-width:520px}
.teaser .ph{width:56px;height:56px;border-radius:16px;flex:none}
.teaser .k{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--must)}
.teaser b{display:block;font-size:16px;font-weight:900}
.teaser span.s{font-size:13px;font-weight:700;color:var(--muted)}

/* pins */
/* pins: Must = photo, Worth = icon, Deep = dot. Size and labels change with zoom (body.zf/zm/zn/zs);
   pins that would collide shrink to a dot (.dot) or drop their label (.nolabel) — see declutter() */
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin .c{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:width .18s,height .18s,transform .15s;box-sizing:border-box;color:#fff}
.pin .c > svg{position:relative}
.pin.must .c{width:52px;height:52px;background:var(--must);border:2.5px solid #fff;box-shadow:0 0 0 3px var(--must),0 5px 14px rgba(31,61,54,.32)}
.pin.must .c .phimg{border-radius:50%}
.pin.must svg{width:22px;height:22px}
.pin.worth .c{width:30px;height:30px;background:var(--worth);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(31,61,54,.25)}
.pin.worth svg{width:15px;height:15px}
.pin.deep .c{width:14px;height:14px;background:var(--deep);border:2.5px solid #fff;box-shadow:0 2px 5px rgba(31,61,54,.3)}
.pin.deep svg{display:none}
body.zf .pin.must .c{width:40px;height:40px}
body.zf .pin.worth .c{width:12px;height:12px}
body.zf .pin.worth svg{display:none}
body.zf .pin.deep{display:none}
body.zm .pin.deep .c{width:10px;height:10px;border-width:2px}
.pin .l{position:absolute;top:100%;margin-top:6px;white-space:nowrap;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:9px;pointer-events:none;display:none;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 1px 4px rgba(31,61,54,.15)}
.pin.must .l{background:var(--ink);color:#fff;box-shadow:none}
body.zm .pin.must .l,body.zn .pin.must .l,body.zn .pin.worth .l,body.zs .pin.deep .l{display:block}
.pin.nolabel .l{display:none!important}
.pin.dot .c{width:10px!important;height:10px!important;border-width:2px;box-shadow:0 1px 4px rgba(31,61,54,.3)}
.pin.dot .c > svg,.pin.dot .phimg{display:none}
.pin.dot .l{display:none!important}
.pin.dot.worth{display:flex}
.pin.on .c,.pin.inday .c{transform:scale(1.12)}
.pin.on .c{box-shadow:0 0 0 3px var(--ink),0 0 0 9px rgba(31,61,54,.18)}
.pin.on .l,.pin.inday .l{display:block!important}
.pin.on .l{background:var(--ink);color:#fff}
.pin.on,.pin.inday{display:flex!important}
.pin.on .c,.pin.inday .c{width:52px;height:52px}
.pin.worth.on .c,.pin.worth.inday .c{width:34px;height:34px}
.pin.deep.on .c,.pin.deep.inday .c{width:18px;height:18px}
.pin.on svg,.pin.inday svg{display:block}
.pin.deep.on svg,.pin.deep.inday svg{display:none}
.pin .n{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--action);color:#fff;font-size:11px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
.pin.inday .n{display:flex}
.pin.hide{display:none!important}
.me{width:22px;height:22px;border-radius:50%;background:#2F80ED;border:4px solid #fff;box-shadow:0 0 0 10px rgba(47,128,237,.18),0 2px 6px rgba(0,0,0,.25)}

/* sheet */
.sheet{position:absolute;z-index:7;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b));height:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 30px rgba(31,61,54,.16);display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden;visibility:hidden;transition:height .32s cubic-bezier(.2,.9,.3,1)}
.sheet.open{visibility:visible}
.sheet.dragging{transition:none}
.grabber{flex:none;padding:8px 0 6px;cursor:grab;touch-action:none}
.grab{width:40px;height:5px;border-radius:3px;background:#D5E0DB;margin:0 auto}
.shead{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 10px;min-height:48px;box-sizing:border-box;touch-action:none}
.shead h2{margin:0 4px;flex:1;min-width:0;font-size:20px;font-weight:900;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{height:38px;min-width:38px;padding:0 9px;border-radius:19px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:none;color:var(--ink)}
.hb.txt{padding:0 15px;background:#E3F2EA;color:var(--action)}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 24px}
.sfoot{flex:none;padding:10px 16px 12px;border-top:1px solid #EEF3F1;background:var(--card)}
.sfoot:empty{display:none}
.sheet.peek .sbody{flex:0 0 0;padding:0;overflow:hidden}
.sfoot .acts{margin:0}
.sfoot .cta{margin:0}
.fnote{margin:6px 0 0;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cta.go{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.days.sticky{position:sticky;top:0;z-index:2;background:var(--card);margin:6px -20px 8px;padding:6px 20px 8px}
.chev{margin-left:auto;display:flex;color:#9DB2AB;align-self:center}
.chev svg{transform:rotate(180deg);width:18px;height:18px}
.stop .bx{display:flex;flex-direction:column;align-items:flex-start;position:relative;padding-right:30px}
.stop .bx .chev{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.mstop .tx{display:flex;flex-direction:column}
.mstop .tx b{font-size:15px;font-weight:900}
.mstop .tx span{font-size:12.5px;font-weight:700;color:var(--muted)}
.linkbtn{color:var(--action);font-weight:900;font-size:13px;margin-right:10px;padding:0;text-decoration:underline;text-underline-offset:2px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px}
.ghost svg{width:18px;height:18px}
.ghost.danger{color:var(--warn);background:#FBE8EB}
.sub{margin:0 0 8px}
.sub{color:var(--muted);font-size:13.5px;font-weight:700;margin:4px 0 10px}
.tier{display:inline-flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 9px;border-radius:8px}
.tier.must{background:var(--must)}.tier.worth{background:var(--worth)}.tier.deep{background:var(--deep)}
.photo{height:150px;border-radius:20px;margin:4px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px;font-size:11px;font-weight:800}
.photo.must{background:repeating-linear-gradient(45deg,#F6D8DE 0 12px,#FBEAED 12px 24px);color:#8E2236}
.photo.worth{background:repeating-linear-gradient(45deg,#CFE7E3 0 12px,#E1F0EE 12px 24px);color:#16655C}
.photo.deep{background:repeating-linear-gradient(45deg,#DED6EC 0 12px,#ECE7F4 12px 24px);color:#4E3A78}
.photo svg{width:40px;height:40px;opacity:.7}
.pic{margin:4px 0 14px;position:relative;border-radius:20px;overflow:hidden;height:190px;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic figcaption{position:absolute;right:8px;bottom:8px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:8px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo.dflink{text-decoration:none}
.photo.dflink span{background:rgba(255,255,255,.85);padding:6px 12px;border-radius:12px;font-size:12.5px;font-weight:900}
.photo{position:relative;overflow:hidden}
.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic{height:200px;padding:0}
.pic.noimg figcaption{display:none}
.dfmore{display:inline-block;margin:-2px 0 10px;font-size:13px;font-weight:900;color:var(--action);text-decoration:none}
.tcard .cover{display:block;height:130px;border-radius:14px;margin:0 0 8px;padding:0;align-items:center;justify-content:center}
.tcard .cover > svg{position:absolute;left:12px;bottom:10px}
.ecard .ethumb{width:64px;height:64px;border-radius:12px;flex:none;margin-left:auto;padding:0}
.teaser.hasbanner{padding:0;overflow:hidden}
.tmain.banner{position:relative;height:118px;padding:14px 16px;color:#fff;align-items:flex-end}
.tmain.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.tmain.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,28,25,.78),rgba(14,28,25,.2) 80%)}
.tmain.banner .btx,.tmain.banner svg{position:relative}
.tmain.banner .btx{flex:1;min-width:0}
.tmain.banner .k{color:#fff;opacity:.9}
.tmain.banner b{color:#fff;font-size:18px}
.tmain.banner .s{color:rgba(255,255,255,.9)}
.hero{position:relative;display:block;width:100%;height:230px;border-radius:22px;overflow:hidden;margin:6px 0 10px;text-align:left;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(14,28,25,.8),rgba(14,28,25,0) 65%)}
.hero .htx{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:3px}
.hero .k{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero b{font-size:21px;font-weight:900;line-height:1.15}
.hero span:last-child{font-size:13px;font-weight:700;line-height:1.4;opacity:.92}
.why{font-size:15.5px;font-weight:600;line-height:1.55;margin:10px 0 12px;color:#2C4740}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--soft);border-radius:12px;padding:6px 11px;font-size:13px;font-weight:800}
.pill.g{background:#E3F2EA;color:var(--action)}
.box{border-radius:18px;background:var(--soft);padding:14px;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.box .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.box b{font-size:14px;font-weight:900}
.tag{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:8px;white-space:nowrap}
.tag.ok{background:#E3F2EA;color:var(--action)}.tag.car{background:#ECEFEE;color:#4F6E66}.tag.chk{background:#FBE8EB;color:var(--warn)}
.box p{margin:0;font-size:14px;font-weight:700;line-height:1.5}
h3{font-size:15px;font-weight:900;margin:18px 0 8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF3F1}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--action)}
.item b{display:block;font-size:15px;font-weight:900;line-height:1.25}
.item p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--muted);line-height:1.45}
.item .now{color:var(--must);font-weight:900}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button,.acts a{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:15px;text-decoration:none}
.acts .heart{width:52px;flex:none;background:var(--soft)}
.acts .heart.on{background:#FCE4EE;color:#B5265F}
.acts .heart.on svg{fill:currentColor}
.acts .dir{flex:1;background:#E6F0EA;color:var(--ink)}
.acts .add{flex:1.3;background:var(--action);color:#fff}
.acts .add.on{background:#E3F2EA;color:var(--action)}
.note{font-size:12px;color:#8AA19A;font-weight:700;margin-top:14px;line-height:1.5}

/* lists */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid #EEF3F1;text-align:left}
.row:last-child{border-bottom:0}
.row .ic{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.row .ic.must{background:var(--must)}.row .ic.worth{background:var(--worth)}.row .ic.deep{background:var(--deep)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:900;line-height:1.25}
.row em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
.row .d{text-align:right;font-weight:900;font-size:14px;white-space:nowrap}
.row .d small{display:block;font-weight:700;font-size:11.5px;color:var(--muted)}
.cta{width:100%;height:50px;border-radius:25px;background:var(--action);color:#fff;font-weight:900;font-size:15px;margin:6px 0}
.ghost{width:100%;height:46px;border-radius:23px;background:var(--soft);font-weight:900;font-size:14px;margin:6px 0}
.tcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--soft);margin:8px 0}
.tcard b{font-size:16px;font-weight:900}
.tcard span{font-size:13px;font-weight:700;color:var(--muted)}
.tcard .pills{margin-top:4px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px 0}
.days button{flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--soft);font-weight:900;font-size:14px}
.days button[aria-pressed="true"]{background:var(--action);color:#fff}
.stop{display:flex;gap:12px}
.stop .tm{width:46px;flex:none;font-size:13.5px;font-weight:900;padding-top:12px}
.stop .bx{flex:1;padding:10px 12px;border-radius:16px;background:var(--soft);text-align:left}
.stop .bx b{font-size:15px;font-weight:900;display:block}
.stop .bx span{font-size:12.5px;font-weight:700;color:var(--muted)}
.leg{margin:0 0 0 70px;border-left:2px dashed #C9D9CF;padding:7px 0 7px 14px;font-size:12.5px;font-weight:800;color:var(--muted)}
.leg.chk{color:var(--warn)}
.mstop{display:flex;align-items:center;gap:10px;padding:8px 0}
.mstop .k{width:26px;height:26px;border-radius:13px;background:var(--action);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.mstop .tx{flex:1;min-width:0;text-align:left}
.mstop .ctl{display:flex;gap:4px}
.mstop .ctl button{width:32px;height:32px;border-radius:16px;background:var(--soft);font-weight:900}
.meter{height:10px;border-radius:5px;background:#EEF3F1;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--action);border-radius:5px}
.meter.over i{background:var(--must)}
.sum{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800}
.hint{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:700;color:#3D5A52;margin:12px 0}
.ecard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:18px;background:var(--soft);margin:8px 0}
.ecard .cal{width:52px;flex:none;border-radius:12px;background:#fff;text-align:center;padding:6px 0}
.ecard .cal b{display:block;font-size:13px;font-weight:900;line-height:1.1}
.ecard .cal span{font-size:10.5px;font-weight:800;color:var(--muted)}
.ecard .tx b{font-size:15px;font-weight:900;display:block}
.ecard .tx p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--muted);line-height:1.45}
.ecard.hot{background:#FCEDF0}
.ecard.hot .cal{background:var(--must);color:#fff}.ecard.hot .cal span{color:#F9DCE2}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:16px;padding:4px;margin:10px 0 0}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:900;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(31,61,54,.14)}
.tcard .hl{display:flex;gap:6px;margin-bottom:4px}
.tcard .hl span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tcard .hl span.must{background:var(--must)}.tcard .hl span.worth{background:var(--worth)}.tcard .hl span.deep{background:var(--deep)}
.tcard .hl svg{width:17px;height:17px}

<body class="zf">
<div id="map" aria-label="Map of Fukui"></div>

<div class="top">
  <div class="searchrow">
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search Fukui" autocomplete="off" aria-label="Search places, food and activities"></label>
    <div class="brand">Visit <b>&nbsp;Fukui</b></div>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filters"></div>
</div>

<button class="fab" id="loc" aria-label="Show my location"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 2.5l7 18-7-4-7 4z" fill="currentColor" stroke="none"/></svg></button>
<div class="teaser" id="teaser" hidden></div>

<section class="sheet" id="sheet" aria-live="polite"></section>
<div class="toast" id="toast" role="status"></div>

<nav class="tabs" role="tablist" aria-label="Main">
  <button role="tab" data-tab="explore" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Explore</button>
  <button role="tab" data-tab="near" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/></svg>Near me</button>
  <button role="tab" data-tab="trips" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M6 19c0-6 12-4 12-10"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/></svg>Trips</button>
  <button role="tab" data-tab="now" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Now</button>
</nav>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON = {
  Dinosaurs:'<path d="M3 17c2 0 3-4 7-4 3 0 4 2 7 1l3-4-3-1-1-3h-3l-1 2"/><path d="M7 17v3M13 17v3"/>',
  Temple:'<path d="M12 3v3M8 6h8l-1 4H9z"/><path d="M6 21h12M9 10v11M15 10v11"/>',
  Shrine:'<path d="M3 6.5c3 .8 15 .8 18 0M5 10h14M7.5 7v13M16.5 7v13"/>',
  Castle:'<path d="M5 20v-8h14v8M8 12V9h8v3M10 9V6h4v3M3.5 20h17"/><path d="M7 9l5-4 5 4"/>',
  History:'<path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/>',
  Nature:'<path d="M2.5 19l6.5-10 4 6 3-4 5.5 8z"/>',
  Onsen:'<path d="M5 15c0 3 3 5 7 5s7-2 7-5"/><path d="M8 12c-1.2-1.6 1.2-2.4 0-4.2M12 12c-1.2-1.6 1.2-2.4 0-4.2M16 12c-1.2-1.6 1.2-2.4 0-4.2"/>',
  Garden:'<circle cx="12" cy="9" r="3"/><path d="M12 12v9M12 17c-2 0-4-1-5-3M12 17c2 0 4-1 5-3"/>',
  Park:'<path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/>',
  Outdoors:'<path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/>',
  Museum:'<path d="M3 9l9-5 9 5M5 9v10M19 9v10M9 9v10M15 9v10M3 20h18"/>',
  Crafts:'<path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/>',
  Food:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M14 3l-4 8M18 4l-6 7"/>',
  Family:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>',
  Town:'<path d="M4 21V10l5-3v14M9 21V5l6-2v18M15 21V9l5 2v10"/>',
  Art:'<path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5 1-1.5 2-1.5h2a4 4 0 0 0 4-4c0-4.5-4-8-9-8z"/><path d="M7.5 11h.01M10 7.5h.01M15 7.5h.01"/>',
  Do:'<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>',
  Event:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  X:'<path d="M6 6l12 12M18 6L6 18"/>', Heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  Back:'<path d="M15 5l-7 7 7 7"/>', Train:'<rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10h12M9 20l1.5-3.5M15 20l-1.5-3.5"/>', Car:'<path d="M5 16l1.5-5h11l1.5 5M4 16h16v3H4zM7 19v1.5M17 19v1.5"/>'
};
const ic = (k, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[k] || ICON.Nature}</svg>`;
const tierKey = t => t === "Must" ? "must" : t === "Worth it" ? "worth" : "deep";
const TIER_ORDER = {"Must":0, "Worth it":1, "Deep & unseen":2};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const P = id => PLACES.find(p => p.id === id);
const shortName = p => p.name.replace("Fukui Prefectural ", "").replace(" (Castle in the Sky)", "").replace(" · Rainbow Line Summit Park", "").replace(" (baikamo flowers)", "").replace(" (Seidaiji)", "").replace(" (Mt Kusuya)", "");
const FUKUI_STN = {lat: 36.062, lon: 136.223};
const thisMonth = new Date().getMonth() + 1;
const nextMonths = [1, 2].map(n => (thisMonth + n - 1) % 12 + 1);

function dist(a, b){
  const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lon - a.lon);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = d => d < 1 ? `${Math.max(10, Math.round(d * 100) * 10)} m` : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
const howLong = d => d <= 2 ? `${Math.max(1, Math.round(d * 1000 / 80))} min walk` : `~${Math.round(d / 35 * 60 + 5)} min drive`;
let me = null;
const inFukui = () => me && dist(me, FUKUI_STN) < 70;
const origin = () => inFukui() ? me : FUKUI_STN;


/* photos: from DISCOVER FUKUI (used with permission), tried in order until one loads */
const PHOTO_CREDIT = "Photo: DISCOVER FUKUI";
const photoSrcs = p => p && p.img ? [p.img] : p && p.dfimg ? [1, 2, 3, 4, 5, 6].map(n => `${p.dfimg}${n}_l.jpg`) : [];
function photoHtml(p){
  const s = photoSrcs(p);
  return s.length ? `<img class="phimg" src="${s[0]}" data-srcs="${s.join("|")}" data-i="0" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="nextSrc(this)">` : "";
}
const evPhoto = (e, small) => e && e.img ? `<img class="phimg" src="${small ? e.thumb : e.img}" alt="" loading="lazy">` : photoHtml(e && e.place ? P(e.place) : null);
function nextSrc(img){
  const s = img.dataset.srcs.split("|"), i = +img.dataset.i + 1;
  if (i < s.length){ img.dataset.i = i; img.src = s[i]; }
  else { if (img.parentNode) img.parentNode.classList.add("noimg"); img.remove(); }
}

/* links between content */
const actsAt = id => ACTIVITIES.filter(a => a.place === id);
const foodsAt = id => FOODS.filter(f => f.places.includes(id));
const eventsAt = id => EVENTS.filter(e => e.place === id);
const isNow = e => e.months && e.months.includes(thisMonth);
const isSoon = e => e.months && nextMonths.some(m => e.months.includes(m)) && !isNow(e);

/* ---------- state ---------- */
let tab = "explore", mode = "all", selected = null, map = null, view = null, viewArg = null;
const tiers = new Set();
const pins = {};
let saved = [], myTrip = null, myDay = 0, routeDay = null;
try { saved = JSON.parse(localStorage.getItem("vf-saved") || "[]"); } catch (e) {}
try { myTrip = JSON.parse(localStorage.getItem("vf-mytrip") || "null"); } catch (e) {}
const persist = () => { try { localStorage.setItem("vf-saved", JSON.stringify(saved)); localStorage.setItem("vf-mytrip", JSON.stringify(myTrip)); } catch (e) {} };

/* ---------- filters ---------- */
const MODES = [["all","Everything","Nature"],["eat","Eat","Food"],["do","Do","Do"],["events","Events","Event"]];
function buildChips(){
  const c = $("#chips");
  c.innerHTML = MODES.map(([k, label, icon]) => `<button class="chip" data-mode="${k}" aria-pressed="${mode === k}">${k === "all" ? "" : ic(icon)}${label}</button>`).join("")
    + '<span class="sep"></span>'
    + [["Must","must"],["Worth it","worth"],["Deep & unseen","deep"]].map(([t, k]) => `<button class="chip" data-tier="${t}" aria-pressed="${tiers.has(t)}"><span class="dot" style="background:var(--${k})"></span>${t}</button>`).join("");
  c.onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    if (b.dataset.mode){ mode = b.dataset.mode; }
    else { const t = b.dataset.tier; tiers.has(t) ? tiers.delete(t) : tiers.add(t); }
    buildChips(); syncPins();
    const tv = topView(); if (tv && (tv.v === "near" || tv.v === "search")) render({keepScroll: true, keepRoute: true});
  };
}
function visible(p){
  if (tiers.size && !tiers.has(p.tier)) return false;
  if (mode === "eat") return p.type === "Food" || foodsAt(p.id).length > 0;
  if (mode === "do") return actsAt(p.id).length > 0;
  if (mode === "events") return eventsAt(p.id).length > 0;
  return true;
}

/* ---------- map ---------- */
const THEME = {land:"#EAF3EC", water:"#A6D6EA", green:"#CFE8D2", road:"#FFFFFF", casing:"#DCE8DF", rail:"#C9D9CF", building:"#DEEAE1", border:"#BFD3C6", label:"#2E5A4F", halo:"#F3F8F4"};
function theme(){
  map.getStyle().layers.forEach(l => {
    const id = l.id.toLowerCase(), set = (k, v) => { try { map.setPaintProperty(l.id, k, v); } catch (e) {} }, lay = (k, v) => { try { map.setLayoutProperty(l.id, k, v); } catch (e) {} };
    if (l.type === "background") set("background-color", THEME.land);
    else if (l.type === "fill"){
      if (/water|ocean|lake|river|sea/.test(id)) set("fill-color", THEME.water);
      else if (/park|wood|forest|grass|scrub|landcover|green|cemetery|golf|nature/.test(id)){ set("fill-color", THEME.green); set("fill-opacity", .85); }
      else if (/building/.test(id)){ set("fill-color", THEME.building); set("fill-outline-color", THEME.building); }
      else if (/landuse|residential|industrial|commercial|school|hospital|aeroway/.test(id)) set("fill-color", THEME.land);
    } else if (l.type === "fill-extrusion") lay("visibility", "none");
    else if (l.type === "line"){
      if (/water|river|stream|canal|ditch/.test(id)) set("line-color", THEME.water);
      else if (/casing|outline/.test(id)) set("line-color", THEME.casing);
      else if (/rail|transit/.test(id)) set("line-color", THEME.rail);
      else if (/boundary|admin/.test(id)) set("line-color", THEME.border);
      else if (/road|highway|street|path|motorway|trunk|primary|secondary|tertiary|minor|service|bridge|tunnel|track/.test(id)) set("line-color", THEME.road);
    } else if (l.type === "symbol"){
      if (/poi|housenum|aerodrome|airport|mountain_peak/.test(id)) return lay("visibility", "none");
      if (l.layout && l.layout["text-field"]){
        lay("text-field", ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"]]);
        set("text-color", THEME.label); set("text-halo-color", THEME.halo); set("text-halo-width", 1.4);
      }
      if (l.layout && l.layout["icon-image"] && /road|shield|highway/.test(id)) lay("visibility", "none");
    }
  });
}
function initMap(){
  if (!window.maplibregl){ $("#map").innerHTML = '<div class="nomap">The map could not load. Check your connection and try again.</div>'; return; }
  map = new maplibregl.Map({container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [136.25, 35.95], zoom: 8.5, minZoom: 7, maxZoom: 18, attributionControl: {compact: true}, maxBounds: [[134.2, 34.3], [138.1, 37.4]]});
  map.on("style.load", theme);
  map.on("load", () => { addFukuiShape(); fitAll(0); drawRoute(); });
  map.on("zoom", zoomClass);
  map.on("move", declutterSoon);
  map.on("click", e => { if (!e.originalEvent.target.closest(".pin")){ const t = topView(); if (t && t.v === "place") back(); } });
  /* moving the map yourself means you want to see it: tuck the sheet down */
  map.on("dragstart", e => { if (e.originalEvent && !wide() && (snap === "half" || snap === "full")){ const t = topView(); if (t && t.v !== "search") setSnap("peek"); } });
  PLACES.forEach(p => {
    const el = document.createElement("button");
    el.className = "pin " + tierKey(p.tier);
    el.setAttribute("aria-label", `${p.name}, ${p.tier}`);
    el.innerHTML = `<span class="c">${ic(p.type)}${p.tier === "Must" ? photoHtml(p) : ""}<span class="n"></span></span><span class="l">${esc(shortName(p))}</span>`;
    el.addEventListener("click", ev => { ev.stopPropagation(); openPlace(p.id); });
    pins[p.id] = {el, m: new maplibregl.Marker({element: el, anchor: "center"}).setLngLat([p.lon, p.lat]).addTo(map)};
    el.setAttribute("aria-label", `${p.name}, ${p.tier}`); el.dataset.id = p.id;
  });
  zoomClass(); syncPins();
}
function addFukuiShape(){
  if (typeof FUKUI_OUTLINE === "undefined" || map.getSource("fukui")) return;
  const firstLabel = (map.getStyle().layers.find(l => l.type === "symbol") || {}).id;
  map.addSource("fukui-mask", {type: "geojson", data: FUKUI_MASK});
  map.addSource("fukui", {type: "geojson", data: FUKUI_OUTLINE});
  /* soften everything outside Fukui so the prefecture reads as one place */
  map.addLayer({id: "fukui-mask", type: "fill", source: "fukui-mask", paint: {"fill-color": "#E6EAE8", "fill-opacity": ["interpolate", ["linear"], ["zoom"], 7, .8, 11, .55, 14, .3]}}, firstLabel);
  map.addLayer({id: "fukui-edge-halo", type: "line", source: "fukui", layout: {"line-join": "round"}, paint: {"line-color": "#FFFFFF", "line-width": ["interpolate", ["linear"], ["zoom"], 7, 4, 12, 7], "line-opacity": .9}}, firstLabel);
  map.addLayer({id: "fukui-edge", type: "line", source: "fukui", layout: {"line-join": "round"}, paint: {"line-color": "#1F6F5C", "line-width": ["interpolate", ["linear"], ["zoom"], 7, 1.6, 12, 2.6], "line-opacity": .75, "line-dasharray": [3, 2]}}, firstLabel);
}
function fitAll(duration = 800){
  if (!map) return;
  map.fitBounds([[135.45, 35.34], [136.83, 36.3]], {padding: {...mapPad(), top: wide() ? 90 : 130, left: wide() ? 470 : 8, right: 8}, duration});
}
function zoomClass(){
  const z = map ? map.getZoom() : 8, B = document.body.classList;
  B.toggle("zf", z < 9); B.toggle("zm", z >= 9 && z < 11.5); B.toggle("zn", z >= 11.5); B.toggle("zs", z >= 13);
  declutterSoon();
}
function syncPins(){
  const dayIds = routeDay ? routeDay.ids : [];
  PLACES.forEach(p => {
    const pin = pins[p.id]; if (!pin) return;
    const k = dayIds.indexOf(p.id);
    pin.el.classList.toggle("hide", !visible(p) && selected !== p.id && k < 0);
    pin.el.classList.toggle("on", selected === p.id);
    pin.el.classList.toggle("inday", k >= 0);
    pin.el.querySelector(".n").textContent = k >= 0 ? k + 1 : "";
  });
  declutterSoon();
}
/* Decide, on screen, which pins get full size and a label. Most important first:
   the selected pin, stops of the trip on screen, then Must, Worth it, Deep & unseen.
   A pin that would overlap one already placed shrinks to a dot; a label that would overlap is dropped. */
let dcPending = false;
function declutterSoon(){ if (!dcPending && map){ dcPending = true; requestAnimationFrame(() => { dcPending = false; declutter(); }); } }
function declutter(){
  const z = map.getZoom(), W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
  const dayIds = routeDay ? routeDay.ids : [];
  const rank = p => p.id === selected ? -2 : dayIds.includes(p.id) ? -1 : TIER_ORDER[p.tier];
  const size = p => {
    if (p.id === selected || dayIds.includes(p.id)) return p.tier === "Must" ? 58 : p.tier === "Worth it" ? 38 : 20;
    if (p.tier === "Must") return z < 9 ? 38 : 54;
    if (p.tier === "Worth it") return z < 9 ? 14 : 34;
    return z < 9 ? 0 : z < 11.5 ? 12 : 16;
  };
  const hasLabel = p => p.id === selected || dayIds.includes(p.id) || (p.tier === "Must" ? z >= 9 : p.tier === "Worth it" ? z >= 11.5 : z >= 13);
  const boxes = [];
  const hit = r => boxes.some(q => r.x < q.x + q.w && r.x + r.w > q.x && r.y < q.y + q.h && r.y + r.h > q.y);
  const list = PLACES.filter(p => pins[p.id] && !pins[p.id].el.classList.contains("hide")).sort((a, b) => rank(a) - rank(b));
  list.forEach(p => {
    const el = pins[p.id].el, pt = map.project([p.lon, p.lat]), s = size(p);
    el.style.zIndex = p.id === selected ? 30 : dayIds.includes(p.id) ? 20 : 10 - TIER_ORDER[p.tier] * 3;
    if (pt.x < -80 || pt.y < -80 || pt.x > W + 80 || pt.y > H + 80 || !s){ el.classList.remove("dot", "nolabel"); return; }
    const r = {x: pt.x - s / 2, y: pt.y - s / 2, w: s, h: s};
    const must = rank(p) < 0;
    if (!must && hit(r)){ el.classList.add("dot"); el.classList.remove("nolabel"); el.style.zIndex = 1; return; }
    el.classList.remove("dot"); boxes.push(r);
    if (!hasLabel(p)){ el.classList.remove("nolabel"); return; }
    const lw = shortName(p).length * 6.6 + 18, lr = {x: pt.x - lw / 2, y: pt.y + s / 2 + 2, w: lw, h: 20};
    if (!must && hit(lr)) el.classList.add("nolabel");
    else { el.classList.remove("nolabel"); boxes.push(lr); }
  });
}
/* ---------- map camera: always frame things in the space the sheet leaves free ---------- */
const wide = () => innerWidth >= 760;
function mapPad(){
  const w = wide();
  return {top: w ? 140 : 150, bottom: w ? 50 : sheetH() + 28 + (snap === "closed" ? teaserH() : 0), left: w ? 490 : 44, right: w ? 70 : 44};
}
/* centre a point in the free space without changing the map's stored padding (that breaks fitBounds) */
const padOffset = () => { const m = mapPad(); return [(m.left - m.right) / 2, (m.top - m.bottom) / 2]; };
function flyTo(p, z = 13){
  if (!map || !p) return;
  map.easeTo({center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), z), offset: padOffset(), duration: 800});
}
function drawRoute(){
  if (!map || !map.isStyleLoaded()) return;
  const coords = routeDay ? routeDay.ids.map(P).filter(Boolean).map(p => [p.lon, p.lat]) : [];
  const data = {type: "Feature", geometry: {type: "LineString", coordinates: coords.length > 1 ? coords : []}};
  const src = map.getSource("route");
  if (src) src.setData(data);
  else {
    map.addSource("route", {type: "geojson", data});
    map.addLayer({id: "route-halo", type: "line", source: "route", layout: {"line-cap": "round", "line-join": "round"}, paint: {"line-color": "#FFFFFF", "line-width": 8}});
    map.addLayer({id: "route", type: "line", source: "route", layout: {"line-cap": "round", "line-join": "round"}, paint: {"line-color": "#1F6F5C", "line-width": 4, "line-dasharray": [1.5, 1.2]}});
  }
}
function showRoute(ids, label, fit){
  const same = routeDay && ids && routeDay.ids.join() === [...new Set(ids)].join();
  routeDay = ids && ids.length ? {ids: [...new Set(ids)], label} : null;
  if (!same){ drawRoute(); syncPins(); }
  if (fit && routeDay && map){
    const b = new maplibregl.LngLatBounds();
    routeDay.ids.map(P).forEach(p => b.extend([p.lon, p.lat]));
    map.fitBounds(b, {padding: mapPad(), maxZoom: 12.5, duration: 800});
  }
}

/* ---------- the sheet: closed / peek / half / full, one back stack per tab ----------
   Back (‹) pops one step and matches the phone's back gesture (history API).
   On Explore the first level shows ✕, which closes the sheet and returns to the map. */
const sheet = $("#sheet");
sheet.innerHTML = `<div class="grabber" id="grabber" aria-hidden="true"><div class="grab"></div></div><div class="shead" id="shead"></div><div class="sbody" id="sbody"></div><div class="sfoot" id="sfoot"></div>`;
let snap = "closed";
const stacks = {explore: [], near: [{v: "near"}], trips: [{v: "trips"}], now: [{v: "now"}]};
const rootDepth = t => t === "explore" ? 0 : 1;
const topView = () => { const s = stacks[tab]; return s[s.length - 1] || null; };
const navH = () => $("nav.tabs").offsetHeight;
function snapPx(name){
  const H = innerHeight - navH();
  if (name === "full") return H - ($(".searchrow").getBoundingClientRect().bottom + 8);
  if (name === "half") return Math.round(H * .5);
  if (name === "peek") return $("#grabber").offsetHeight + $("#shead").offsetHeight + $("#sfoot").offsetHeight;
  return 0;
}
const sheetH = () => snap === "closed" || wide() ? 0 : snapPx(snap);
const teaserH = () => { const t = $("#teaser"); return t.hidden ? 0 : t.offsetHeight + 14; };
function setSnap(name, animate = true){
  snap = name;
  sheet.classList.toggle("open", name !== "closed");
  sheet.classList.toggle("dragging", !animate);
  ["peek", "half", "full"].forEach(n => sheet.classList.toggle(n, n === name));
  sheet.style.height = wide() ? "" : snapPx(name) + "px";
  const t = topView(); if (t && name !== "closed") t.snap = name;
  updateTeaser();
  const fab = $("#loc");
  fab.style.bottom = `calc(var(--nav) + var(--safe-b) + ${(wide() ? 0 : sheetH()) + (snap === "closed" ? teaserH() : 0) + 14}px)`;
  fab.hidden = !wide() && name === "full";
  $("#chips").style.visibility = !wide() && name === "full" ? "hidden" : "";
}

function render(opts = {}){
  const t = topView();
  if (!t){ setSnap("closed"); selected = null; syncPins(); applyRoute(false); return; }
  const out = VIEWS[t.v](t);
  const depth = stacks[tab].length;
  const left = depth > rootDepth(tab) ? (depth === 1 ? `<button class="hb" id="hback" aria-label="Close">${ic("X")}</button>` : `<button class="hb" id="hback" aria-label="Back">${ic("Back")}</button>`) : "";
  $("#shead").innerHTML = `${left}<h2>${esc(out.title)}</h2>${out.right || ""}`;
  const body = $("#sbody"), keep = opts.keepScroll ? body.scrollTop : 0;
  body.innerHTML = out.body;
  $("#sfoot").innerHTML = out.foot || "";
  body.scrollTop = keep;
  selected = t.v === "place" ? t.id : null;
  syncPins();
  setSnap(opts.snap || t.snap || out.snap || "half");
  const hb = $("#hback"); if (hb) hb.onclick = back;
  body.querySelectorAll("[data-place]").forEach(b => b.onclick = () => openPlace(b.dataset.place));
  body.querySelectorAll("[data-trip]").forEach(b => b.onclick = () => push({v: "trip", i: +b.dataset.trip, day: 1}));
  out.bind && out.bind(t);
  if (!opts.keepRoute) applyRoute(true);
}
/* The route on the map belongs to the nearest trip view in the stack, so it stays
   visible while you look at one of its stops, and goes away when you leave the trip. */
function applyRoute(fit){
  const s = stacks[tab]; let ctx = null;
  for (let k = s.length - 1; k >= 0; k--) if (s[k].v === "trip" || s[k].v === "mytrip"){ ctx = s[k]; break; }
  if (!ctx){ if (routeDay){ routeDay = null; drawRoute(); syncPins(); } return; }
  const ids = ctx.v === "trip" ? TRIPS[ctx.i].stops.filter(x => x.day === ctx.day && x.place).map(x => x.place) : (myTrip ? myTrip.days[myDay] || [] : []);
  showRoute(ids, ctx.v, fit && topView() === ctx);
}
function push(v, opts = {}){
  const s = stacks[tab], t = topView();
  if (t && t.v === "place" && v.v === "place"){ s[s.length - 1] = v; history.replaceState({vf: 1}, ""); }
  else { s.push(v); history.pushState({vf: 1}, ""); }
  render(opts);
}
function back(){
  if (stacks[tab].length > rootDepth(tab)) history.back();
  else setSnap("peek");
}
addEventListener("popstate", () => {
  const s = stacks[tab];
  if (s.length > rootDepth(tab)){
    const gone = s.pop();
    if (gone.v === "search"){ q.value = ""; q.blur(); }
    render();
  }
});
function setTab(t){
  if (t === tab){
    const s = stacks[t];
    if (s.length > rootDepth(t)){ s.length = rootDepth(t); render(); }
    else if (t !== "explore") setSnap(snap === "half" ? "full" : "half");
    return;
  }
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  if (t === "near") locate(false);
  render();
  if (t === "near" && map){ const o = origin(); map.easeTo({center: [o.lon, o.lat], zoom: Math.max(map.getZoom(), 12.5), offset: padOffset(), duration: 800}); }
}
function openPlace(id, fly = true){
  if (!P(id)) return;
  push({v: "place", id});
  if (fly) flyTo(P(id));
}
function openMyTrip(){
  tab = "trips";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === "trips"));
  stacks.trips = [{v: "trips"}];
  push({v: "mytrip"});
}

/* drag the sheet by its top; a tap on the handle switches half and full */
let drag = null;
function onDown(e){
  if (wide() || e.target.closest("button, a, input")) return;
  drag = {y: e.clientY, h: sheet.offsetHeight, t: performance.now(), moved: false, id: e.pointerId};
  sheet.classList.add("dragging");
}
function onMove(e){
  if (!drag) return;
  const dy = drag.y - e.clientY;
  if (Math.abs(dy) > 5) drag.moved = true;
  if (!drag.moved) return;
  sheet.style.height = Math.max(snapPx("peek"), Math.min(snapPx("full"), drag.h + dy)) + "px";
}
function onUp(e){
  if (!drag) return;
  const d = drag; drag = null;
  sheet.classList.remove("dragging");
  if (!d.moved){ if (e.target.closest("#grabber") || e.target.closest("#shead h2")) setSnap(snap === "half" ? "full" : "half"); return; }
  const h = sheet.offsetHeight, v = (d.y - e.clientY) / Math.max(1, performance.now() - d.t);
  let target;
  if (v > .6) target = snap === "peek" ? "half" : "full";
  else if (v < -.6) target = snap === "full" ? "half" : "peek";
  else target = ["peek", "half", "full"].reduce((a, b) => Math.abs(snapPx(b) - h) < Math.abs(snapPx(a) - h) ? b : a);
  setSnap(target);
}
["grabber", "shead"].forEach(id => $("#" + id).addEventListener("pointerdown", onDown));
addEventListener("pointermove", onMove);
addEventListener("pointerup", onUp);
addEventListener("pointercancel", onUp);

/* ---------- views ---------- */
const placeRow = (p, d) => `<button class="row" data-place="${p.id}"><span class="ic ${tierKey(p.tier)}">${ic(p.type)}</span><span class="tx"><b>${esc(shortName(p))}</b><em>${esc(p.tier)} · ${esc(p.type)} · ${esc(p.area)}</em></span>${d !== undefined ? `<span class="d">${fmtDist(d)}<small>${howLong(d)}</small></span>` : ""}</button>`;
const dayOf = id => myTrip ? myTrip.days.findIndex(d => d.includes(id)) : -1;

/* trips: data helpers */
let tf = {days: "1", car: false};
try { Object.assign(tf, JSON.parse(localStorage.getItem("vf-tf") || "{}")); } catch (e) {}
const saveTf = () => { try { localStorage.setItem("vf-tf", JSON.stringify(tf)); } catch (e) {} };
const nDays = t => parseInt(t.length, 10);
const bucket = t => nDays(t) >= 3 ? "3" : String(nDays(t));
const isCar = t => t.mode === "Rental car";
const tripPlaces = t => [...new Set(t.stops.map(s => s.place).filter(Boolean))].map(P).filter(Boolean);
const stripCheck = s => String(s || "").replace(/\s*\(check[^)]*\)/gi, "");
function tripNotes(t){
  const ids = new Set(tripPlaces(t).map(p => p.id).filter(id => id !== "city"));
  const now = [];
  EVENTS.forEach(e => { if (isNow(e) && e.place && ids.has(e.place) && e.tier !== "Deep & unseen") now.push(e.name); });
  FOODS.forEach(f => { if (f.months && f.months.includes(thisMonth) && f.tier !== "Deep & unseen" && f.places.some(id => ids.has(id))) now.push(f.name); });
  const warn = [...new Set(t.stops.filter(s => s.months && !s.months.includes(thisMonth)).map(s => s.warn))];
  return {now: [...new Set(now)].slice(0, 2), warn};
}
function tripCard({t, i}){
  const hi = tripPlaces(t).sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier]).slice(0, 4);
  const n = tripNotes(t);
  const cover = hi.find(p => photoSrcs(p).length);
  return `<button class="tcard" data-trip="${i}">
    ${cover ? `<span class="cover photo ${tierKey(cover.tier)}">${ic(cover.type)}${photoHtml(cover)}</span>` : ""}
    <span class="hl">${hi.map(p => `<span class="${tierKey(p.tier)}" title="${esc(shortName(p))}">${ic(p.type)}</span>`).join("")}</span>
    <b>${esc(t.name)}</b><span>${esc(t.blurb)}</span>
    <span class="route">${ic(isCar(t) ? "Car" : "Train")}${esc(t.start)} → ${esc(t.end)}</span>
    ${n.now.length || n.warn.length ? `<span class="pills">${n.now.map(x => `<span class="pill now">${MONTHS[thisMonth - 1]}: ${esc(x)}</span>`).join("")}${n.warn.map(x => `<span class="pill warn">${esc(x)}</span>`).join("")}</span>` : ""}
  </button>`;
}
const seg = (key, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-${key}="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
function tripProgress(){
  if (!myTrip) return null;
  myTrip.done = myTrip.done || [];
  const all = myTrip.days.flatMap((d, k) => d.map(id => k + ":" + id));
  return {total: all.length, done: all.filter(x => myTrip.done.includes(x)).length};
}
function newTripFrom(i){
  const t = TRIPS[i], days = [...new Set(t.stops.map(s => s.day))];
  myTrip = {name: t.name, from: i, done: [], days: days.map(d => [...new Set(t.stops.filter(s => s.day === d && s.place).map(s => s.place))])};
  myDay = 0; persist();
}
const hasStops = () => { const pr = tripProgress(); return pr && pr.total > 0; };
function nextStop(){
  if (!myTrip) return null;
  myTrip.done = myTrip.done || [];
  for (let d = myDay; d < myTrip.days.length; d++){
    const id = myTrip.days[d].find(x => !myTrip.done.includes(d + ":" + x));
    if (id) return {day: d, p: P(id)};
  }
  return null;
}
const gmapsUrl = p => {
  const d = dist(origin(), p);
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.jp + " " + p.area.split(" (")[0])}&travelmode=${inFukui() && d < 2 ? "walking" : "transit"}`;
};
function addToTrip(id){
  if (!myTrip){ myTrip = {name: "My Fukui trip", from: null, done: [], days: [[]]}; myDay = 0; }
  const where = dayOf(id);
  if (where >= 0){
    myTrip.days[where] = myTrip.days[where].filter(x => x !== id); persist();
    toast(`Removed from Day ${where + 1}`, "Undo", () => { myTrip.days[where].push(id); persist(); render({keepScroll: true, keepRoute: true}); });
  } else {
    myTrip.days[myDay].push(id); persist();
    toast(`Added to Day ${myDay + 1}`, "See trip", openMyTrip);
  }
}

const VIEWS = {
  place(t){
    const p = P(t.id), id = p.id, tk = tierKey(p.tier), d = dist(origin(), p), here = inFukui();
    const carOnly = /^car|car best|car or taxi|^car\./i.test(p.access);
    const unverified = /\(check/i.test(p.access);
    const acts = actsAt(id), foods = foodsAt(id), evs = eventsAt(id);
    const where = dayOf(id), on = saved.includes(id);
    const addLabel = where >= 0 ? `✓ In Day ${where + 1}` : myTrip ? `Add to Day ${myDay + 1}` : "Add to a trip";
    return {
      title: shortName(p),
      body: `${photoSrcs(p).length ? `<figure class="pic photo ${tk}">${ic(p.type)}${photoHtml(p)}<figcaption>${esc(p.credit || PHOTO_CREDIT)}</figcaption></figure>` : `<div class="photo ${tk}">${ic(p.type)}<span>Photo coming soon</span></div>`}
        <div class="meta"><span class="tier ${tk}">${esc(p.tier)}</span><span>${esc(p.jp)} · ${esc(p.area)}</span></div>
        <div class="pills"><span class="pill g">${fmtDist(d)} ${here ? "away" : "from Fukui Stn"}</span><span class="pill">${esc(p.best)}</span></div>
        <p class="why">${esc(p.why)}</p>${p.df ? `<a class="dfmore" href="${esc(p.df)}" target="_blank" rel="noopener">More photos and details on DISCOVER FUKUI ↗</a>` : ""}
        <div class="box"><div class="t"><b>${carOnly ? "Getting there" : "Without a car"}</b>${unverified ? '<span class="tag chk">Not checked yet</span>' : carOnly ? '<span class="tag car">Best by car</span>' : '<span class="tag ok">No car needed</span>'}</div><p>${esc(stripCheck(p.access))}</p></div>
        ${acts.length ? `<h3>Things to do here</h3>${acts.map(a => `<div class="item"><span class="ic">${ic("Do")}</span><div><b>${esc(a.name)}</b><p>${esc(a.what)} ${esc(stripCheck(a.note))}</p></div></div>`).join("")}` : ""}
        ${foods.length ? `<h3>Eat here</h3>${foods.map(f => `<div class="item"><span class="ic">${ic("Food")}</span><div><b>${esc(f.name)} <span style="color:var(--muted);font-weight:700">${esc(f.jp)}</span></b><p>${esc(f.what)}${f.months && f.months.includes(thisMonth) ? ' <span class="now">In season now.</span>' : ""}</p></div></div>`).join("")}` : ""}
        ${evs.length ? `<h3>Events here</h3>${evs.map(e => `<div class="item"><span class="ic">${ic("Event")}</span><div><b>${esc(e.name)}</b><p>${isNow(e) ? '<span class="now">This month.</span> ' : ""}${esc(e.when)}. ${esc(e.note)}</p></div></div>`).join("")}` : ""}
        <p class="note">Pin positions are approximate and opening hours aren't listed yet. Check before you go. Directions open Google Maps.</p>`,
      foot: `<div class="acts">
        <button class="heart ${on ? "on" : ""}" id="save" aria-label="${on ? "Remove from saved" : "Save"}" aria-pressed="${on}">${ic("Heart")}</button>
        <a class="dir" href="${gmapsUrl(p)}" target="_blank" rel="noopener">Directions</a>
        <button class="add ${where >= 0 ? "on" : ""}" id="add">${addLabel}</button></div>`,
      snap: "half",
      bind(){
        $("#save").onclick = () => { saved.includes(id) ? saved = saved.filter(x => x !== id) : saved.push(id); persist(); toast(saved.includes(id) ? "Saved" : "Removed from saved"); render({keepScroll: true, keepRoute: true}); };
        $("#add").onclick = () => { addToTrip(id); render({keepScroll: true, keepRoute: true}); updateTeaser(); };
      }
    };
  },
  near(){
    const o = origin();
    const list = PLACES.filter(visible).map(p => ({p, d: dist(o, p)})).sort((a, b) => a.d - b.d).slice(0, 30);
    const note = inFukui() ? "Closest to you first" : me ? "You're outside Fukui, so distances are from Fukui Station" : "Distances from Fukui Station";
    return {title: "Near me", snap: "half",
      body: `<p class="sub">${note}</p>${me ? "" : '<button class="cta" id="useloc">Use my location</button>'}
        ${list.length ? list.map(({p, d}) => placeRow(p, d)).join("") : '<div class="empty">Nothing matches these filters.</div>'}`,
      bind(){ const u = $("#useloc"); if (u) u.onclick = () => locate(true); }};
  },
  search(){
    const t = q.value.trim().toLowerCase(), hit = s => String(s || "").toLowerCase().includes(t);
    const ps = t ? PLACES.filter(p => visible(p) && (hit(p.name) || hit(p.jp) || hit(p.area) || hit(p.type) || foodsAt(p.id).some(f => hit(f.name)) || actsAt(p.id).some(a => hit(a.name)))) : [];
    const o = origin();
    return {title: t ? `“${q.value.trim()}”` : "Search", snap: "full",
      body: t ? (ps.length ? ps.map(p => placeRow(p, dist(o, p))).join("") : '<div class="empty">No matches. Try another word, or clear the filters.</div>')
        : `<p class="sub">Places, food and things to do. Try “crab”, “temple” or “Ono”.</p>${saved.length ? `<h3>Saved</h3>${saved.map(P).filter(Boolean).map(p => placeRow(p)).join("")}` : ""}`};
  },
  trips(){
    const all = TRIPS.map((t, i) => ({t, i}));
    const exact = all.filter(x => bucket(x.t) === tf.days && isCar(x.t) === tf.car);
    let extra = [], extraTitle = "";
    if (tf.car){ extra = all.filter(x => bucket(x.t) === tf.days && !isCar(x.t)); extraTitle = "These work with a car too"; }
    else if (tf.days !== "1"){ extra = all.filter(x => !isCar(x.t) && +bucket(x.t) < +tf.days); extraTitle = "Or put shorter trips together"; }
    if (!exact.length && !extra.length){ extra = all.filter(x => isCar(x.t) === tf.car); extraTitle = "Closest matches"; }
    const pr = tripProgress(), nx = nextStop();
    return {title: "Trips", snap: "full",
      body: `${myTrip ? `<button class="tcard mine" id="mine"><span class="k2">Your trip</span><b>${esc(myTrip.name)}</b><span>${myTrip.days.length} day${myTrip.days.length > 1 ? "s" : ""} · ${pr.done} of ${pr.total} stops done${nx && nx.p ? ` · Next: ${esc(shortName(nx.p))}` : ""}</span></button>` : ""}
        <p class="sub" style="margin-top:4px">${myTrip ? "Or pick another trip" : "Pick your days and how you'll get around"}</p>
        ${seg("days", [["1", "1 day"], ["2", "2 days"], ["3", "3+ days"]], tf.days)}
        ${seg("car", [["0", "No car"], ["1", "Rental car"]], tf.car ? "1" : "0")}
        ${exact.map(tripCard).join("")}
        ${extra.length ? `<h3>${extraTitle}</h3>${extra.map(tripCard).join("")}` : ""}
        <button class="ghost" id="scratch" style="margin-top:14px">Start from scratch instead</button>
        ${saved.length ? `<h3>Saved places (${saved.length})</h3>${saved.map(P).filter(Boolean).map(p => placeRow(p)).join("")}` : ""}`,
      bind(){
        sheet.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { tf.days = b.dataset.days; saveTf(); render({keepScroll: true, keepRoute: true}); });
        sheet.querySelectorAll("[data-car]").forEach(b => b.onclick = () => { tf.car = b.dataset.car === "1"; saveTf(); render({keepScroll: true, keepRoute: true}); });
        const mine = $("#mine"); if (mine) mine.onclick = () => push({v: "mytrip"});
        $("#scratch").onclick = () => {
          if (hasStops() && !confirm("Start a new trip? Your current trip will be replaced.")) return;
          myTrip = {name: "My Fukui trip", from: null, done: [], days: Array.from({length: +tf.days}, () => [])};
          myDay = 0; persist(); push({v: "mytrip"});
        };
      }};
  },
  trip(t){
    const tr = TRIPS[t.i], days = [...new Set(tr.stops.map(s => s.day))], stops = tr.stops.filter(s => s.day === t.day), n = tripNotes(tr);
    let html = "";
    stops.forEach((s, k) => {
      if (k){ const chk = /\(check/i.test(s.how); html += `<div class="leg ${chk ? "chk" : ""}">${esc(stripCheck(s.how))}${chk ? " · not checked yet" : ""}</div>`; }
      const off = s.months && !s.months.includes(thisMonth);
      html += `<div class="stop"><span class="tm">${esc(s.time)}</span>${s.place ? `<button class="bx" data-place="${s.place}">` : '<div class="bx">'}<b>${esc(s.stop)}</b>${k === 0 && s.how ? `<span>${esc(stripCheck(s.how))}</span><br>` : ""}${s.tip ? `<span>${esc(s.tip)}</span>` : ""}${off ? `<br><span style="color:var(--warn);font-weight:900">Not on in ${MONTH_LONG[thisMonth - 1]}</span>` : ""}${s.place ? `<i class="chev">${ic("Back")}</i></button>` : "</div>"}</div>`;
    });
    const mine = myTrip && myTrip.from === t.i;
    return {title: tr.name, snap: "half",
      body: `<div class="pills"><span class="pill">${esc(tr.length)}</span><span class="pill ${isCar(tr) ? "" : "g"}">${isCar(tr) ? "Rental car" : "No car needed"}</span><span class="pill">${esc(tr.start)} → ${esc(tr.end)}</span>${n.now.map(x => `<span class="pill now">${MONTHS[thisMonth - 1]}: ${esc(x)}</span>`).join("")}</div>
        ${days.length > 1 ? `<div class="days sticky">${days.map(d => `<button data-day="${d}" aria-pressed="${d === t.day}">Day ${d}</button>`).join("")}</div>` : '<div style="height:10px"></div>'}
        ${html}
        <div class="hint">Times are a rough plan. Anything marked "not checked yet" needs checking before you go. Tap a stop to see it.</div>`,
      foot: mine ? `<button class="cta" id="usetrip">Open your trip</button>` : `<button class="cta" id="usetrip">Use this trip</button><p class="fnote">You can change the stops after</p>`,
      bind(v){
        sheet.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { v.day = +b.dataset.day; render(); });
        $("#usetrip").onclick = () => {
          if (mine){ stacks.trips = [{v: "trips"}, {v: "mytrip"}]; history.replaceState({vf: 1}, ""); render(); return; }
          if (hasStops() && !confirm(`Use "${tr.name}"? Your current trip will be replaced.`)) return;
          newTripFrom(v.i);
          stacks.trips = [{v: "trips"}, {v: "mytrip"}]; history.replaceState({vf: 1}, "");
          render(); toast("This is your trip now");
        };
      }};
  },
  mytrip(t){
    if (!myTrip){ return VIEWS.trips(); }
    myTrip.done = myTrip.done || [];
    if (myDay >= myTrip.days.length) myDay = 0;
    const ids = myTrip.days[myDay], edit = !!t.edit;
    let h = 0, html = "";
    ids.forEach((id, k) => {
      const p = P(id); if (!p) return;
      if (k){ const prev = P(ids[k - 1]), d = dist(prev, p) * 1.3, hr = d < 1.6 ? d / 4.5 : d / 30 + .2; h += hr; html += `<div class="leg">~${Math.max(3, Math.round(hr * 60))} min · ${fmtDist(d / 1.3)}</div>`; }
      h += 1.5;
      const done = myTrip.done.includes(myDay + ":" + id);
      html += `<div class="mstop ${done ? "isdone" : ""}"><button class="k ${done ? "done" : ""}" data-done="${id}" aria-label="${done ? "Mark as not done" : "Mark as done"}" aria-pressed="${done}">${done ? "✓" : k + 1}</button><button class="tx" data-place="${id}"><b>${esc(shortName(p))}</b><span>${esc(p.area)}</span></button>${edit ? `<span class="ctl"><button data-up="${k}" aria-label="Move up">↑</button><button data-down="${k}" aria-label="Move down">↓</button><button data-rm="${k}" aria-label="Remove">✕</button></span>` : `<i class="chev">${ic("Back")}</i>`}</div>`;
    });
    const over = h > 9, nx = nextStop(), nxToday = nx && nx.day === myDay ? nx.p : null;
    return {title: myTrip.name, snap: "half",
      right: `<button class="hb txt" id="edit">${edit ? "Done" : "Edit"}</button>`,
      body: `<div class="days sticky">${myTrip.days.map((d, k) => `<button data-mday="${k}" aria-pressed="${k === myDay}">Day ${k + 1}${d.length ? " · " + d.length : ""}</button>`).join("")}${edit ? `<button id="addday" aria-label="Add a day">+ Day</button>` : ""}</div>
        ${ids.length ? `<div class="sum"><span>Day ${myDay + 1}: about ${Math.round(h * 2) / 2} h</span><span style="color:${over ? "var(--must)" : "var(--muted)"}">${over ? "Too full" : `${Math.round((9 - h) * 2) / 2} h free`}</span></div><div class="meter ${over ? "over" : ""}"><i style="width:${Math.min(100, h / 9 * 100)}%"></i></div>${html}` : '<div class="empty">No stops on this day yet.</div>'}
        <button class="ghost" id="addstops">${ic("Do")} Add stops from the map</button>
        ${edit ? `<button class="ghost danger" id="clear">Delete this trip</button>` : `<p class="hint">Tap the number when you've been there. ${myTrip.from != null ? `<button class="linkbtn" id="orig">See the original plan with times</button>` : ""}</p>`}`,
      foot: nxToday ? `<a class="cta go" href="${gmapsUrl(nxToday)}" target="_blank" rel="noopener">${ic("Train")} Go to ${esc(shortName(nxToday))}</a>` : ids.length ? `<p class="fnote" style="margin:4px 0">Day ${myDay + 1} done. Nice!</p>` : "",
      bind(v){
        $("#edit").onclick = () => { v.edit = !v.edit; render({keepScroll: true, keepRoute: true}); };
        sheet.querySelectorAll("[data-mday]").forEach(b => b.onclick = () => { myDay = +b.dataset.mday; render(); });
        const ad = $("#addday"); if (ad) ad.onclick = () => { myTrip.days.push([]); myDay = myTrip.days.length - 1; persist(); render(); };
        const mv = (i, j) => { const a = myTrip.days[myDay]; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; persist(); render({keepScroll: true}); };
        sheet.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mv(+b.dataset.up, +b.dataset.up - 1));
        sheet.querySelectorAll("[data-down]").forEach(b => b.onclick = () => mv(+b.dataset.down, +b.dataset.down + 1));
        sheet.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const id = myTrip.days[myDay].splice(+b.dataset.rm, 1)[0]; persist(); render({keepScroll: true}); toast(`Removed ${shortName(P(id))}`, "Undo", () => { myTrip.days[myDay].splice(+b.dataset.rm, 0, id); persist(); render({keepScroll: true}); }); });
        sheet.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
          const key = myDay + ":" + b.dataset.done;
          myTrip.done = myTrip.done.includes(key) ? myTrip.done.filter(x => x !== key) : [...myTrip.done, key];
          persist(); render({keepScroll: true, keepRoute: true});
        });
        $("#addstops").onclick = () => { setSnap("peek"); toast(`Tap a pin, then “Add to Day ${myDay + 1}”`); };
        const og = $("#orig"); if (og) og.onclick = () => push({v: "trip", i: myTrip.from, day: Math.min(myDay + 1, [...new Set(TRIPS[myTrip.from].stops.map(s => s.day))].length)});
        const cl = $("#clear"); if (cl) cl.onclick = () => { if (!confirm("Delete this trip?")) return; myTrip = null; persist(); stacks.trips = [{v: "trips"}]; history.replaceState({vf: 1}, ""); render(); toast("Trip deleted"); };
      }};
  },
  now(){
    const now = EVENTS.filter(isNow).sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier]);
    const hero = now.find(e => e.img), rest = now.filter(e => e !== hero);
    const soon = EVENTS.filter(isSoon).sort((a, b) => a.months.indexOf(nextMonths[0]) - b.months.indexOf(nextMonths[0]));
    const foods = FOODS.filter(f => f.months && f.months.includes(thisMonth));
    const ecard = (e, hot) => `<${e.place ? `button data-place="${e.place}"` : "div"} class="ecard ${hot ? "hot" : ""}"><span class="cal"><b>${esc(MONTHS[(hot ? thisMonth : e.months.find(m => nextMonths.includes(m))) - 1])}</b><span>${esc(e.tier === "Must" ? "MUST" : e.tier === "Worth it" ? "WORTH IT" : "DEEP")}</span></span><span class="tx"><b>${esc(e.name)}</b><p>${esc(e.when)} · ${esc(e.where)}. ${esc(e.note)}</p>${e.latest && !/every|check/i.test(e.latest) ? `<p style="font-weight:800">Latest: ${esc(e.latest)}</p>` : ""}</span>${e.img || (e.place && photoSrcs(P(e.place)).length) ? `<span class="ethumb photo ${tierKey(e.tier)}">${evPhoto(e, true)}</span>` : ""}</${e.place ? "button" : "div"}>`;
    return {title: `Now in Fukui · ${MONTHS[thisMonth - 1]}`, snap: "half",
      body: `${hero ? `<${hero.place ? `button data-place="${hero.place}"` : "div"} class="hero"><img src="${hero.img}" alt=""><span class="htx"><span class="k">${MONTH_LONG[thisMonth - 1]} · ${esc(hero.tier)}</span><b>${esc(hero.name)}</b><span>${esc(hero.when)} · ${esc(hero.where)}. ${esc(hero.note)}</span></span></${hero.place ? "button" : "div"}>` : ""}
        ${rest.length ? rest.map(e => ecard(e, true)).join("") : hero ? "" : '<div class="empty">Nothing special listed this month.</div>'}
        ${foods.length ? `<h3>In season to eat</h3>${foods.map(f => `<div class="item"><span class="ic">${ic("Food")}</span><div><b>${esc(f.name)} <span style="color:var(--muted);font-weight:700">${esc(f.jp)}</span></b><p>${esc(f.what)} ${esc(f.where)}.</p>${f.places.length ? `<p>${f.places.map(id => `<button data-place="${id}" class="linkbtn">${esc(shortName(P(id)))}</button>`).join("")}</p>` : ""}</div></div>`).join("")}` : ""}
        ${soon.length ? `<h3>Coming up</h3>${soon.map(e => ecard(e, false)).join("")}` : ""}
        <p class="note">Dates change each year, so check before you go.</p>`};
  }
};

/* bar on the map: your next stop, or what's on now (only on Explore with no sheet open) */
function updateTeaser(){
  const t = $("#teaser");
  t.classList.remove("hasbanner");
  if (tab !== "explore" || snap !== "closed"){ t.hidden = true; return; }
  const nx = nextStop(), pr = tripProgress();
  if (nx && nx.p){
    t.hidden = false;
    t.innerHTML = `<button class="tmain" id="tmain"><span class="ph photo ${tierKey(nx.p.tier)}" style="margin:0;height:56px;padding:0;align-items:center;justify-content:center">${ic(nx.p.type)}${photoHtml(nx.p)}</span><span style="flex:1;min-width:0"><span class="k" style="color:var(--action)">Your trip · Day ${nx.day + 1}</span><b>Next: ${esc(shortName(nx.p))}</b><span class="s">${pr.done} of ${pr.total} done</span></span></button><a class="go" href="${gmapsUrl(nx.p)}" target="_blank" rel="noopener">Go</a>`;
    $("#tmain").onclick = () => { myDay = nx.day; openMyTrip(); };
    return;
  }
  const nowEv = EVENTS.filter(isNow).sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier]);
  const e = nowEv.find(x => x.img) || nowEv[0];
  if (!e){ t.hidden = true; return; }
  t.hidden = false;
  if (e.img){
    t.innerHTML = `<button class="tmain banner" id="tmain"><img src="${e.img}" alt=""><span class="btx"><span class="k">Now in Fukui</span><b>${esc(e.name)}</b><span class="s">${esc(e.when)} · ${esc(e.where)}</span></span>${ic("Back").replace('class="i"', 'class="i" style="transform:rotate(180deg)"')}</button>`;
    t.classList.add("hasbanner");
  } else {
    t.innerHTML = `<button class="tmain" id="tmain"><span class="ph photo ${tierKey(e.tier)}" style="margin:0;height:56px;padding:0;align-items:center;justify-content:center">${ic("Event")}${evPhoto(e, true)}</span><span style="flex:1;min-width:0"><span class="k">Now in Fukui</span><b>${esc(e.name)}</b><span class="s">${esc(e.when)}</span></span>${ic("Back").replace('class="i"', 'class="i" style="transform:rotate(180deg);color:var(--muted)"')}</button>`;
  }
  $("#tmain").onclick = () => setTab("now");
}

/* location */
let meMarker = null, watchId = null;
function locate(center){
  if (!navigator.geolocation){ toast("Location isn't available here"); return; }
  if (watchId !== null){ if (center && me) centerMe(); return; }
  if (center) toast("Finding you…");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const prev = me;
    me = {lat: pos.coords.latitude, lon: pos.coords.longitude};
    $("#loc").classList.add("on");
    if (map){
      if (!meMarker){ const el = document.createElement("div"); el.className = "me"; meMarker = new maplibregl.Marker({element: el}).setLngLat([me.lon, me.lat]).addTo(map); }
      else meMarker.setLngLat([me.lon, me.lat]);
    }
    if (first && center) centerMe();
    first = false;
    const tv = topView();
    if (tv && tv.v === "near" && (!prev || dist(prev, me) > .1)) render({keepScroll: true, keepRoute: true});
  }, err => { watchId = null; toast(err.code === 1 ? "Location is blocked. Allow it in Settings" : "Couldn't find your location"); }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
function centerMe(){
  if (!inFukui()){ toast(`You're ${fmtDist(dist(me, FUKUI_STN))} from Fukui`); return; }
  map && map.easeTo({center: [me.lon, me.lat], zoom: 14, offset: padOffset(), duration: 800});
}

let tt;
function toast(text, action, fn){
  const el = $("#toast");
  el.innerHTML = `<span>${esc(text)}</span>${action ? `<button id="tact">${esc(action)}</button>` : ""}`;
  el.classList.add("show"); el.classList.toggle("act", !!action);
  if (action) $("#tact").onclick = () => { el.classList.remove("show"); fn(); };
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), action ? 4000 : 1800);
}

/* wire up */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#loc").onclick = () => locate(true);
const q = $("#q");
q.addEventListener("focus", () => { const t = topView(); if (!t || t.v !== "search") push({v: "search"}, {snap: "full", keepRoute: true}); });
q.addEventListener("input", () => { const t = topView(); if (t && t.v === "search") render({snap: "full", keepRoute: true}); });
q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
addEventListener("keydown", e => { if (e.key === "Escape") back(); });
addEventListener("resize", () => { map && map.resize(); setSnap(snap, false); });
history.replaceState({vf: 0}, "");
buildChips();
initMap();
render();
</script>
