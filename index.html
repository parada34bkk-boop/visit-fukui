<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit Fukui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<meta name="theme-color" content="#A9CBDA">
<style>
:root{
  /* layout: full-bleed hand-drawn map, chips on top, sheet at the bottom (left panel on wide screens) */
  --sea:#A9CBDA; --land:#F4EAD3; --ink:#3B3A36; --paper:#FFFCF4; --accent:#D9693A; --muted:#7C766A;
  --font-display:"Kalam","Comic Sans MS",cursive; --font-body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#map{position:absolute;inset:0;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:2.5px solid var(--ink);background:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.pin svg{width:20px;height:20px}
.pin.hi{width:54px;height:54px;border-radius:16px;border-width:3px;box-shadow:3px 4px 0 var(--ink);rotate:-4deg}
.pin.hi:nth-child(4n){rotate:5deg}
.pin.hi svg{width:30px;height:30px}
.pin.dot{width:16px;height:16px;border-width:2px}
.pin.dot svg{display:none}
.pin:hover{transform:translate(-50%,-50%) scale(1.1)}
.pin.active{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 5px rgba(217,105,58,.35)}
.pin.saved::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.pin-label{position:absolute;transform:translate(-50%,0);pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 8px;line-height:1.5}
.pin-label.hi{font-size:15px;background:#FFF3D6;box-shadow:2px 2px 0 var(--ink)}
.top{z-index:1000;position:absolute;top:0;left:0;right:0;padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
.brand h1{white-space:nowrap;margin:0;font-family:var(--font-display);font-size:28px;line-height:1;font-weight:700}
.brand span{font-size:12px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;pointer-events:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:700}
.chip i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.chip[aria-pressed="false"]{background:transparent;opacity:.55}
.zoom{position:absolute;right:16px;top:146px;z-index:1000;display:flex;flex-direction:column;gap:8px}
body.street .sheet{max-height:46%}
@media (max-width:420px){.brand span{display:none}.brand h1{font-size:24px}.mode button{padding:6px 10px}}
@media (min-width:820px){.zoom{top:50%;transform:translateY(-50%)}body.street .sheet{max-height:calc(100% - 150px)}}
.zoom button{width:42px;height:42px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);font-size:22px;font-weight:800;line-height:1}
.sheet{z-index:1100;position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:2.5px solid var(--ink);border-radius:22px 22px 0 0;padding:10px 16px 18px;max-height:62%;overflow-y:auto;transition:transform .25s}
.grab{width:44px;height:5px;border-radius:5px;background:#D8CFBD;margin:0 auto 12px}
.plan{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:2.5px solid var(--ink);background:var(--accent);color:#fff;border-radius:999px;padding:13px 16px;font-size:17px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.plan:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.plan .count{background:var(--paper);color:var(--ink);border-radius:999px;font-size:12px;padding:2px 8px;border:2px solid var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.sec h2{margin:0;font-family:var(--font-display);font-size:21px}
.sec small{color:var(--muted);font-size:12px}
.hl{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hcard{flex:none;width:138px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:0;text-align:left;overflow:hidden}
.hcard .art{height:70px;display:flex;align-items:center;justify-content:center}
.hcard .art svg{width:34px;height:34px}
.hcard b{display:block;font-size:13px;padding:7px 9px 0;line-height:1.25}
.hcard em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);padding:2px 9px 8px}
.card .art{height:120px;border:2px solid var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative}
.card .art svg{width:60px;height:60px}
.card .art .tag{position:absolute;left:10px;top:10px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:800;padding:2px 10px}
.card .close{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:18px;font-weight:800;line-height:1}
.card h3{margin:12px 0 0;font-family:var(--font-display);font-size:26px;line-height:1.1;text-wrap:balance}
.card .jp{color:var(--muted);font-size:14px;margin-top:2px}
.card p{margin:10px 0;font-size:15px;line-height:1.55;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.facts div{border:2px dashed #CFC4AE;border-radius:12px;padding:7px 9px}
.facts small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.facts span{font-size:13px;font-weight:700}
.actions{display:flex;gap:10px}
.actions button,.actions a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:11px 10px;font-size:15px;font-weight:800;text-decoration:none;color:var(--ink);background:var(--paper)}
.actions .add{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--ink)}
.actions .add.on{background:#6E9E5A}
.note{font-size:11.5px;color:var(--muted);margin-top:12px}
.toast{z-index:1200;position:absolute;left:50%;top:110px;transform:translate(-50%,-10px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mode{display:flex;gap:2px;margin-left:auto;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:3px}
.mode button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#street{position:absolute;inset:0;display:none;background:#EDE6D6}
body.street #street{display:block}
body.street #map{display:none}
#street .leaflet-tile-pane{filter:sepia(.22) saturate(.95)}
#street .leaflet-control-attribution{font-size:10px;margin-top:118px!important;background:rgba(255,252,244,.85)}
.lp{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.lp svg{width:20px;height:20px}
.lp.hi{width:50px;height:50px;border-radius:15px;box-shadow:3px 4px 0 var(--ink)}
.lp.hi svg{width:28px;height:28px}
.lp.active{transform:scale(1.15);box-shadow:0 0 0 5px rgba(217,105,58,.45)}
.lp.saved{outline:3px solid var(--accent);outline-offset:2px}
.me{width:20px;height:20px;border-radius:50%;background:#2F80ED;border:3.5px solid #fff;box-shadow:0 0 0 2px rgba(47,128,237,.35),0 2px 6px rgba(0,0,0,.3)}
.zoom .loc{font-size:0;display:flex;align-items:center;justify-content:center}
.zoom .loc svg{width:22px;height:22px}
.zoom .loc.on{background:#2F80ED}
.zoom .loc.on svg{stroke:#fff}
.nrow{display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1.5px dashed #E2D8C3;background:none;padding:10px 2px;text-align:left}
.nrow .ic{width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center}
.nrow .ic svg{width:24px;height:24px}
.nrow b{display:block;font-size:14px;line-height:1.3}
.nrow em{font-style:normal;font-size:12px;color:var(--muted)}
.nrow .d{margin-left:auto;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.nrow .d small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.locate{width:100%;margin-top:4px;border:2px dashed var(--ink);background:none;border-radius:14px;padding:12px;font-weight:800;font-size:14px}
@media (min-width:820px){
  .sheet{left:16px;right:auto;bottom:16px;top:auto;width:380px;border:2.5px solid var(--ink);border-radius:22px;max-height:calc(100% - 150px)}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Illustrated map of Fukui Prefecture">

<script>
const CATS = {
  dino:    {name:"Dinosaurs", color:"#F2B33D", icon:'<path d="M3 18c1.5 0 2-3 5-3.5 2-.3 3 .8 5 .5 1.5-.3 2-2 2-4l2-3 2.5.5L20 11l-2.5.3c0 3-1 6-4 7"/><path d="M7 18v2M12 18v2"/><circle cx="18.6" cy="8.4" r=".6" fill="currentColor"/>'},
  nature:  {name:"Nature", color:"#86B26F", icon:'<path d="M2.5 19l6.5-10 4 6 3-4 5.5 8z"/><path d="M7.5 11.5l1.5 1 1.5-1"/>'},
  temple:  {name:"Temples & shrines", color:"#E07A62", icon:'<path d="M3 6.5c3 .8 15 .8 18 0M5 10h14M7.5 7v13M16.5 7v13M12 7v3"/>'},
  history: {name:"Castles & history", color:"#C9A577", icon:'<path d="M5 20v-8h14v8M8 12V9h8v3M10 9V6h4v3M3.5 20h17M11 20v-3h2v3"/><path d="M7 9l5-4 5 4"/>'},
  onsen:   {name:"Onsen", color:"#F09A6E", icon:'<path d="M5 15c0 3 3 5 7 5s7-2 7-5"/><path d="M8 12c-1.2-1.6 1.2-2.4 0-4.2M12 12c-1.2-1.6 1.2-2.4 0-4.2M16 12c-1.2-1.6 1.2-2.4 0-4.2"/>'},
  food:    {name:"Food", color:"#D883A8", icon:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M14 3l-4 8M18 4l-6 7"/>'},

};

const PLACES = [
  {id:"dino", cat:"dino", hi:1, name:"Fukui Prefectural Dinosaur Museum", jp:"福井県立恐竜博物館", town:"Katsuyama", lat:36.083, lon:136.507, time:"3–4 h", access:"Echizen Rwy + bus", desc:"One of the world's big dinosaur museums, built near the quarries where Japan's own dinosaurs were dug up. Huge skeletons, a live-moving T. rex and a fossil dig area."},
  {id:"heisenji", cat:"temple", name:"Heisenji Hakusan Shrine", jp:"平泉寺白山神社", town:"Katsuyama", lat:36.050, lon:136.533, time:"1 h", access:"Car / taxi", desc:"An ancient mountain shrine where the whole forest floor is a carpet of moss under giant cedars. Quiet and green, best after rain."},
  {id:"eiheiji", cat:"temple", hi:1, name:"Eiheiji Temple", jp:"永平寺", town:"Eiheiji", lat:36.055, lon:136.355, time:"1.5–2 h", access:"Direct bus from Fukui Stn", desc:"Head temple of Soto Zen, founded in 1244. Monks still train here; covered wooden corridors climb the hillside between halls."},
  {id:"tojinbo", cat:"nature", hi:1, name:"Tojinbo Cliffs", jp:"東尋坊", town:"Sakai", lat:36.238, lon:136.123, time:"1–1.5 h", access:"Bus from Awara-Onsen Stn", desc:"Rugged basalt columns rising straight out of the Sea of Japan. Walk the cliff edge, take a short boat trip, and stay for the sunset."},

  {id:"awara", cat:"onsen", name:"Awara Onsen", jp:"あわら温泉", town:"Awara", lat:36.222, lon:136.190, time:"Overnight", access:"Shinkansen Awara-Onsen", desc:"Fukui's best-known hot spring town, with ryokan baths and a free footbath outside the station. A good base for Tojinbo."},
  {id:"ichijodani", cat:"history", hi:1, name:"Ichijodani Asakura Ruins", jp:"一乗谷朝倉氏遺跡", town:"Fukui City", lat:35.997, lon:136.296, time:"1.5 h", access:"JR Etsumi-Hoku Line", desc:"A whole samurai-era castle town lost in 1573 and dug out again, with a rebuilt street of houses and shops you can walk through."},
  {id:"yokokan", cat:"history", name:"Yokokan Garden", jp:"養浩館庭園", town:"Fukui City", lat:36.073, lon:136.217, time:"45 min", access:"Walk from Fukui Stn", desc:"A former lord's villa built around a pond, with tatami rooms that open onto the water. A calm stop in the city centre."},
  {id:"ono", cat:"history", hi:1, name:"Echizen Ono Castle", jp:"越前大野城", town:"Ono", lat:35.979, lon:136.482, time:"1 h", access:"JR Kuzuryu Line", desc:"The \"castle in the sky\": on autumn mornings it floats above a sea of cloud. Ono's old town below is known for spring water."},
  {id:"washi", cat:"craft", name:"Echizen Washi Village", jp:"越前和紙の里", town:"Echizen City", lat:35.906, lon:136.236, time:"1–2 h", access:"Bus from Takefu", desc:"A papermaking area with 1,500 years of history. Watch artisans at work and make your own sheet of washi."},
  {id:"knife", cat:"craft", name:"Takefu Knife Village", jp:"タケフナイフビレッジ", town:"Echizen City", lat:35.884, lon:136.140, time:"1 h", access:"Car / taxi", desc:"A shared workshop where Echizen knife makers forge blades. See the forging up close and buy straight from the makers."},
  {id:"megane", cat:"craft", name:"Megane Museum", jp:"めがねミュージアム", town:"Sabae", lat:35.950, lon:136.187, time:"1 h", access:"Walk from Sabae Stn", desc:"Sabae makes most of Japan's glasses frames. Learn the story, shop local brands, or make a frame yourself."},
  {id:"coast", cat:"nature", name:"Echizen Coast", jp:"越前海岸", town:"Echizen Town", lat:35.985, lon:136.025, time:"Half day drive", access:"Car recommended", desc:"A dramatic coastal road of cliffs and rock arches. In winter, wild narcissus flowers cover the slopes."},
  {id:"crab", cat:"food", name:"Echizen crab at Mikuni Port", jp:"越前がに", town:"Sakai", lat:36.212, lon:136.160, time:"1 h", access:"Near Tojinbo", desc:"Fukui's famous snow crab, landed in the colder months. Try it boiled whole at a harbour restaurant."},
  {id:"katsudon", cat:"food", name:"Sauce katsudon", jp:"ソースカツ丼", town:"Fukui City", lat:36.055, lon:136.235, time:"45 min", access:"Near Fukui Stn", desc:"Fukui's soul food: thin pork cutlets dipped in a sweet Worcestershire sauce over rice."},
  {id:"soba", cat:"food", name:"Echizen oroshi soba", jp:"越前おろしそば", town:"Echizen City", lat:35.900, lon:136.180, time:"45 min", access:"Near Echizen-Takefu Stn", desc:"Cold buckwheat noodles topped with grated daikon radish and bonito flakes. Light, peppery and very local."},
  {id:"kehi", cat:"temple", name:"Kehi Jingu Shrine", jp:"氣比神宮", town:"Tsuruga", lat:35.656, lon:136.081, time:"45 min", access:"Walk from Tsuruga Stn", desc:"Tsuruga's grand shrine, with one of Japan's three great wooden torii gates at the entrance."},

  {id:"kumagawa", cat:"history", name:"Kumagawa-juku", jp:"熊川宿", town:"Wakasa", lat:35.465, lon:135.904, time:"1 h", access:"Bus from Kaminaka", desc:"An old post town on the Saba Kaido, the route that carried mackerel to Kyoto. Wooden houses line a clear water channel."},

const OUTLINE = [[136.27,36.30],[136.20,36.27],[136.13,36.235],[136.11,36.20],[136.14,36.16],[136.10,36.10],[136.05,36.03],[136.00,35.97],[135.98,35.90],[136.01,35.82],[136.04,35.76],[136.05,35.70],[136.07,35.66],[136.04,35.638],[136.00,35.66],[135.97,35.70],[135.95,35.66],[135.97,35.62],[135.93,35.60],[135.88,35.62],[135.85,35.58],[135.80,35.55],[135.75,35.515],[135.70,35.53],[135.65,35.52],[135.60,35.54],[135.55,35.51],[135.50,35.54],[135.45,35.53],[135.44,35.48],[135.48,35.42],[135.55,35.39],[135.65,35.37],[135.75,35.38],[135.82,35.42],[135.88,35.42],[135.93,35.44],[136.00,35.50],[136.08,35.53],[136.15,35.58],[136.22,35.64],[136.26,35.72],[136.30,35.78],[136.38,35.82],[136.48,35.84],[136.58,35.83],[136.68,35.86],[136.78,35.92],[136.83,36.00],[136.78,36.06],[136.70,36.10],[136.65,36.17],[136.58,36.22],[136.48,36.27],[136.38,36.29]];
const RIVER = [[136.56,35.95],[136.48,36.01],[136.40,36.04],[136.30,36.08],[136.24,36.13],[136.19,36.18],[136.15,36.215]];

const K = 690, LON0 = 135.30, LAT0 = 36.45, W = 1100, H = 1080;
const px = lon => (lon - LON0) * K;

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function rough(pts, amp, close){
  let d = "";
  pts.forEach((p, i) => {
    const x = px(p[0]) + (rnd() - .5) * amp, y = py(p[1]) + (rnd() - .5) * amp;
    if (i === 0) { d += `M${x.toFixed(1)} ${y.toFixed(1)}`; return; }
    const q = pts[i - 1], mx = (px(q[0]) + px(p[0])) / 2 + (rnd() - .5) * amp * 2, my = (py(q[1]) + py(p[1])) / 2 + (rnd() - .5) * amp * 2;
    d += ` Q${mx.toFixed(1)} ${my.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
  });

}
function inside(lon, lat){
  let c = false;
  for (let i = 0, j = OUTLINE.length - 1; i < OUTLINE.length; j = i++){
    const [xi, yi] = OUTLINE[i], [xj, yj] = OUTLINE[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

  const coast = rough(OUTLINE, 3, true);
  [[90,'#BCD8E4',1],[62,'#A9CBDA',1],[44,'#C6DFE9',1],[22,'#D7EAF1',1]].forEach(([w,c]) => s.push(`<path d="${coast}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`));

const svg = document.getElementById("svg"), pinsEl = document.getElementById("pins"), mapEl = document.getElementById("map");
svg.innerHTML = drawMap();

let view = {x: 0, y: 0, z: 1};
const active = new Set(Object.keys(CATS));
let trip = [];
try { trip = JSON.parse(localStorage.getItem("vf-trip") || "[]"); } catch (e) {}
let selected = null;

function fit(){
  const r = mapEl.getBoundingClientRect(), wide = r.width >= 820;
  const left = wide ? 410 : 0, top = 110, bottom = wide ? 20 : r.height * .3;
  const minX = px(wide ? 135.42 : 135.98), maxX = px(136.86), minY = py(36.31), maxY = py(wide ? 35.36 : 35.80);
  const z = Math.min((r.width - left - 30) / (maxX - minX), (r.height - top - bottom) / (maxY - minY));
  view.z = z;
  view.x = left + (r.width - left - (maxX - minX) * z) / 2 - minX * z;
  view.y = top + (r.height - top - bottom - (maxY - minY) * z) / 2 - minY * z;
}
function render(){
  const r = mapEl.getBoundingClientRect();
  svg.setAttribute("viewBox", `${-view.x / view.z} ${-view.y / view.z} ${r.width / view.z} ${r.height / view.z}`);
  pinsEl.querySelectorAll(".pin,.pin-label").forEach(el => {
    const p = PLACES.find(q => q.id === el.dataset.id), show = active.has(p.cat);
    const x = px(p.lon) * view.z + view.x, y = py(p.lat) * view.z + view.y;
    el.style.left = x + "px";
    if (el.classList.contains("pin")){
      el.style.top = y + "px"; el.style.display = show ? "flex" : "none";
      el.classList.toggle("active", selected === p.id);
      el.classList.toggle("dot", !p.hi && view.z < 1.25 && selected !== p.id);
      el.classList.toggle("saved", trip.includes(p.id));
    } else {
      el.style.top = (y + (p.hi ? 36 : 22)) + "px";
      el.style.display = show && (p.hi || view.z > 1.5 || selected === p.id) ? "block" : "none";
    }
  });
  const taken = [...pinsEl.querySelectorAll(".pin.hi")].filter(e => e.style.display !== "none").map(e => e.getBoundingClientRect());
  const labels = [...pinsEl.querySelectorAll(".pin-label")].filter(e => e.style.display !== "none")
    .sort((a, b) => (b.dataset.id === selected) - (a.dataset.id === selected) || b.classList.contains("hi") - a.classList.contains("hi"));
  labels.forEach(el => {
    const r = el.getBoundingClientRect();
    const hit = taken.some(t => r.left < t.right && r.right > t.left && r.top < t.bottom && r.bottom > t.top);
    if (hit && el.dataset.id !== selected) el.style.display = "none"; else taken.push(r);
  });

}
function buildPins(){

const shortName = p => p.name.replace("Fukui Prefectural ", "").replace(" at Mikuni Port", "").replace(" · Rainbow Line", "").replace(": mackerel and temples", "");

const sheet = document.getElementById("sheet");
const icon = (c, size) => `<svg viewBox="0 0 24 24" fill="none" stroke="#3B3A36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:${size}px;height:${size}px">${CATS[c].icon}</svg>`;

function openPlace(id, fly){

function flyTo(p){
  const r = mapEl.getBoundingClientRect(), wide = r.width >= 820;
  const z = Math.max(view.z, 1.6), cx = wide ? (r.width + 400) / 2 : r.width / 2, cy = wide ? r.height / 2 : r.height * .3;
  view.z = z; view.x = cx - px(p.lon) * z; view.y = cy - py(p.lat) * z;
}
let tt;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }

function zoomAt(f, cx, cy){
  const nz = Math.min(6, Math.max(.4, view.z * f)); f = nz / view.z;
  view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.z = nz; render();

const ptrs = new Map(); let last = null, moved = 0;
mapEl.addEventListener("pointerdown", e => { if (e.target.closest(".pin")) return; mapEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; mapEl.classList.add("dragging"); });
mapEl.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1){ view.x += e.clientX - prev[0]; view.y += e.clientY - prev[1]; moved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]); render(); }
  else if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = mapEl.getBoundingClientRect();
    if (last) zoomAt(d / last, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    last = d; moved = 99;
  }
});
const end = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) last = null; if (!ptrs.size) mapEl.classList.remove("dragging"); };
mapEl.addEventListener("pointerup", e => { end(e); });
mapEl.addEventListener("pointercancel", end);
mapEl.addEventListener("wheel", e => { e.preventDefault(); const r = mapEl.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
document.getElementById("zin").onclick = () => { if (mode === "street") return lmap.zoomIn(); const r = mapEl.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
document.getElementById("zout").onclick = () => { if (mode === "street") return lmap.zoomOut(); const r = mapEl.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
window.addEventListener("resize", () => { fit(); render(); if (lmap) lmap.invalidateSize(); });

let mode = "art", lmap = null, meLayer = null, me = null, watchId = null, nearKey = "";
const markers = {};
const FUKUI_STN = {lat: 36.062, lon: 136.223};
function dist(a, b){
  const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lon - a.lon);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = d => d < 1 ? `${Math.max(10, Math.round(d * 100) * 10)} m` : d < 10 ? `${d.toFixed(1)} km` : `${Math.round(d)} km`;
const howLong = d => d <= 2 ? `${Math.max(1, Math.round(d * 1000 / 80))} min walk` : `~${Math.round(d / 35 * 60 + 5)} min by car`;
const nearFukui = () => me && dist(me, FUKUI_STN) < 70;

function setMode(m){
  mode = m;
  document.body.classList.toggle("street", m === "street");
  document.getElementById("m-art").setAttribute("aria-pressed", m === "art");
  document.getElementById("m-street").setAttribute("aria-pressed", m === "street");
  try { localStorage.setItem("vf-mode", m); } catch (e) {}
  if (m === "street"){ initStreet(); setTimeout(() => lmap.invalidateSize(), 0); }
  selected ? openPlace(selected) : home();
}
function initStreet(){
  if (lmap || !window.L) return;
  lmap = L.map("street", {zoomControl: false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd", maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(lmap);
  lmap.attributionControl.setPrefix(false);
  lmap.attributionControl.setPosition("topright");
  PLACES.forEach(p => {
    const c = CATS[p.cat], s = p.hi ? 50 : 38;
    const icon = L.divIcon({className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2],
      html: `<div class="lp${p.hi ? " hi" : ""}" style="background:${c.color}"><svg viewBox="0 0 24 24" fill="none" stroke="#3B3A36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></div>`});
    markers[p.id] = L.marker([p.lat, p.lon], {icon, title: p.name, riseOnHover: true}).addTo(lmap).on("click", () => openPlace(p.id, true));
  });
  const wide = innerWidth >= 820;
  lmap.fitBounds(L.latLngBounds(PLACES.map(p => [p.lat, p.lon])), {paddingTopLeft: [wide ? 420 : 24, 130], paddingBottomRight: [70, wide ? 30 : innerHeight * .35]});
  if (me) drawMe();
  syncStreet();
}
function syncStreet(){
  if (!lmap) return;
  PLACES.forEach(p => {
    const m = markers[p.id], show = active.has(p.cat);
    if (show && !lmap.hasLayer(m)) m.addTo(lmap);
    if (!show && lmap.hasLayer(m)) m.remove();
    const el = m.getElement() && m.getElement().querySelector(".lp");
    if (el){ el.classList.toggle("active", selected === p.id); el.classList.toggle("saved", trip.includes(p.id)); }
    m.setZIndexOffset(selected === p.id ? 1000 : p.hi ? 100 : 0);
  });
}
function streetFly(p){
  if (!lmap) return;
  const wide = innerWidth >= 820, z = Math.max(lmap.getZoom(), 14);
  const pt = lmap.project([p.lat, p.lon], z).add([wide ? -200 : 0, wide ? 0 : innerHeight * .22]);
  lmap.flyTo(lmap.unproject(pt, z), z, {duration: .8});
}
function drawMe(){
  if (!lmap || !me) return;
  if (!meLayer) meLayer = L.layerGroup().addTo(lmap);
  meLayer.clearLayers();
  L.circle([me.lat, me.lon], {radius: Math.min(me.acc, 1500), color: "#2F80ED", weight: 1, fillOpacity: .12, interactive: false}).addTo(meLayer);
  L.marker([me.lat, me.lon], {interactive: false, zIndexOffset: 2000, icon: L.divIcon({className: "", iconSize: [20, 20], iconAnchor: [10, 10], html: '<div class="me"></div>'})}).addTo(meLayer);
}
function locate(center){
  if (!navigator.geolocation){ toast("Location isn't available on this device"); return; }
  document.getElementById("loc").classList.add("on");
  if (watchId !== null){ if (center && me) centerMe(); return; }
  if (center) toast("Finding you…");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    me = {lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy};
    drawMe();
    if (first && center) centerMe();
    first = false;
    const key = me.lat.toFixed(3) + me.lon.toFixed(3);
    if (key !== nearKey){ nearKey = key; if (!selected && mode === "street") homeStreet(); }
  }, err => {
    watchId = null;
    document.getElementById("loc").classList.remove("on");
    toast(err.code === 1 ? "Location is blocked. Allow it in your browser settings" : "Couldn't find your location");
  }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
function centerMe(){
  if (!nearFukui()){ toast(`You're ${fmtDist(dist(me, FUKUI_STN))} from Fukui`); return; }
  if (mode !== "street") setMode("street");
  lmap.flyTo([me.lat, me.lon], 15, {duration: .8});
}
function homeStreet(){
  const n = trip.length, here = nearFukui(), from = here ? me : FUKUI_STN;
  const list = PLACES.filter(p => active.has(p.cat) && p.cat !== "station").map(p => ({p, d: dist(from, p)})).sort((a, b) => a.d - b.d).slice(0, 10);
  const note = here ? "From where you are" : me ? "You're outside Fukui · from Fukui Stn" : "From Fukui Station";
  sheet.innerHTML = `<div class="grab"></div>
    <button class="plan" id="plan">Plan your trip ${n ? `<span class="count">${n} saved</span>` : ""}</button>
    <div class="sec"><h2>Near you</h2><small>${note}</small></div>
    ${me ? "" : '<button class="locate" id="findme">Use my location to sort by distance</button>'}
    <div>${list.map(({p, d}) => `<button class="nrow" data-id="${p.id}"><span class="ic" style="background:${CATS[p.cat].color}">${icon(p.cat, 24)}</span><span><b>${shortName(p)}</b><em>${CATS[p.cat].name} · ${p.town}</em></span><span class="d">${fmtDist(d)}<small>${howLong(d)}</small></span></button>`).join("")}</div>`;
  sheet.querySelector("#plan").onclick = () => toast("Trip planner is coming next");
  const f = sheet.querySelector("#findme"); if (f) f.onclick = () => locate(true);
  sheet.querySelectorAll(".nrow").forEach(b => b.onclick = () => openPlace(b.dataset.id, true));
  syncStreet();
}
document.getElementById("m-art").onclick = () => setMode("art");
document.getElementById("m-street").onclick = () => setMode("street");
document.getElementById("loc").onclick = () => locate(true);

buildChips(); buildPins(); fit();
let saved = "art"; try { saved = localStorage.getItem("vf-mode") || "art"; } catch (e) {}
if (saved === "street" && window.L) setMode("street"); else home();
</script>
</body>
